  furTapTool.addEventListener("click",function(e){
    if(getFurAction()==="eject" && e.detail>0 && !e.target.closest(".fur-eject-hotspot")) return;
    handleFurTap();
  });

  // ---------- 준비 단계 (탭으로 진행: 패드 장착 -> 클리너 분사) ----------
  Object.keys(prepLayers).forEach(function(key){
    prepLayers[key].addEventListener("click", function(){
      if(selectedCategory !== "chin") return;
      if(game.state !== key) return;
      if(prepLayers[key].classList.contains("acting")) return;
      ensureAudioContext(); // 최초 사용자 제스처 시점에 오디오 컨텍스트 unlock
      if(key === "prep1"){ sfx.equip(); } else { sfx.spray(); }
      prepLayers[key].classList.add("acting");
      setTimeout(function(){ advanceState(); }, 650);
    });
  });

  // ---------- 눈곱 개별 제거 ----------
  function countRemovedEyeCrusts(side){
    return game.eye.removed[side].filter(function(removed){ return removed; }).length;
  }

  function totalRemovedEyeCrusts(){
    return countRemovedEyeCrusts("left") + countRemovedEyeCrusts("right");
  }

  function designPx(value){ return value * gameStage.getBoundingClientRect().width / 480; }

  function positionEyeComb(localX,localY,remember){
    var rect = gameStage.getBoundingClientRect();
    var x = Math.max(designPx(38),Math.min(rect.width - designPx(22),localX));
    // 하단 눈곱을 빗을 때는 손잡이가 게임 화면 아래로 일부 잘려도 빗살이 닿도록 허용한다.
    var y = Math.max(designPx(142),Math.min(rect.height + designPx(96),localY));
    eyeCombCursor.style.transform = "translate(" + x + "px," + y + "px)";
    if(remember && rect.width && rect.height){
      game.eye.combX = x / rect.width;
      game.eye.combY = y / rect.height;
    }
  }

  function moveEyeCombCursor(clientX,clientY){
    var rect = gameStage.getBoundingClientRect();
    positionEyeComb(clientX - rect.left,clientY - rect.top,true);
  }

  function getEyeCombTeethRect(){
    var rect = eyeCombCursor.getBoundingClientRect();
    var isRight = game.eye.side === "right";
    return {
      left:rect.left + rect.width * (isRight ? 0.42 : 0.24),
      right:rect.left + rect.width * (isRight ? 0.76 : 0.58),
      top:rect.top + rect.height * 0.03,
      bottom:rect.top + rect.height * 0.3
    };
  }

  function updateCaughtEyeCrust(){
    if(!activeEyeCrust) return;
    var teeth = getEyeCombTeethRect();
    var teethX = (teeth.left + teeth.right) / 2;
    var teethY = (teeth.top + teeth.bottom) / 2;
    var dx = teethX - eyeCaughtOriginX;
    var dy = teethY - eyeCaughtOriginY;
    activeEyeCrust.style.setProperty("--dx",(game.eye.side === "right" ? -dx : dx) + "px");
    activeEyeCrust.style.setProperty("--dy",dy + "px");
  }

  function catchEyeCrustWithTeeth(clientX,clientY,directionalAdvance){
    if(activeEyeCombMode !== "groom") return;
    if(activeEyeCrust){
      eyeCaughtSweep += directionalAdvance;
      return;
    }
    var teeth = getEyeCombTeethRect();
    var intersectedCrust = null;
    eyeCrusts.forEach(function(crust){
      if(intersectedCrust || !crust.classList.contains("target")) return;
      var rect = crust.getBoundingClientRect();
      var intersects = teeth.right + 7 >= rect.left && teeth.left - 7 <= rect.right &&
                       teeth.bottom + 7 >= rect.top && teeth.top - 7 <= rect.bottom;
      if(intersects) intersectedCrust = crust;
    });

    if(!intersectedCrust || directionalAdvance <= 0){
      eyeStrokeCandidate = null;
      eyeStrokeProgress = 0;
      return;
    }
    if(eyeStrokeCandidate !== intersectedCrust){
      eyeStrokeCandidate = intersectedCrust;
      eyeStrokeProgress = 0;
    }
    eyeStrokeProgress += directionalAdvance;
    if(eyeStrokeProgress < 12) return;

    var rect = intersectedCrust.getBoundingClientRect();
    activeEyeCrust = intersectedCrust;
    eyeCaughtOriginX = (rect.left + rect.right) / 2;
    eyeCaughtOriginY = (rect.top + rect.bottom) / 2;
    eyeCatchStartX = clientX;
    eyeCatchStartY = clientY;
    eyeCaughtSweep = 0;
    activeEyeCrust.classList.add("caught");
    updateCaughtEyeCrust();
  }

  function completeEyeCrustRemoval(crust){
    var index = Number(crust.getAttribute("data-eye-index"));
    var side = game.eye.side;
    crust.classList.remove("caught");
    crust.classList.add("plucked");
    sfx.pluck();
    setTimeout(function(){
      if(selectedCategory !== "eyes") return;
      game.eye.removed[side][index] = true;
      crust.classList.remove("plucked");
      crust.style.setProperty("--dx","0px");
      crust.style.setProperty("--dy","0px");

      if(game.state === "prep2"){
        setState("stage1");
      }else if(game.state === "stage1" && countRemovedEyeCrusts("left") === 3){
        game.eye.combX = 0.82;
        game.eye.combY = 0.86;
        setState("stage2");
      }else if(game.state === "stage2" && countRemovedEyeCrusts("right") === 3){
        setState("complete");
      }else{
        render();
      }
    },260);
  }

  function finishEyeCombDrag(e){
    var dragDistance = Math.hypot(e.clientX - eyeCombDragStartX,e.clientY - eyeCombDragStartY);
    eyeCombPickup.classList.remove("dragging");
    eyeCombCursor.classList.remove("dragging");

    if(activeEyeCombMode === "pickup"){
      if(e.type !== "pointercancel" && dragDistance >= 42){
        game.eye.combPicked = true;
        sfx.equip();
        advanceState();
      }else{
        eyeCombCursor.classList.remove("visible","ready");
      }
      activeEyeCombMode = null;
      return;
    }

    if(activeEyeCrust){
      var crust = activeEyeCrust;
      if(e.type !== "pointercancel" && eyeCaughtSweep >= 28){
        completeEyeCrustRemoval(crust);
      }else{
        crust.classList.remove("caught");
        crust.style.setProperty("--dx","0px");
        crust.style.setProperty("--dy","0px");
      }
    }

    activeEyeCrust = null;
    eyeStrokeCandidate = null;
    eyeStrokeProgress = 0;
    eyeCaughtSweep = 0;
    activeEyeCombMode = null;
  }

  // ---------- 치아 케어 ----------
  function getDentalAction(){
    if(selectedCategory !== "teeth") return null;
    if(game.state === "prep1") return "gel";
    if(game.state === "prep2") return "edge";
    if(game.state === "stage1") return "upper";
    if(game.state === "stage2") return "lower";
    return "complete";
  }

  function handleDentalPrep(){
    if(getDentalAction() !== "gel" || dentalPrep.classList.contains("acting")) return;
    ensureAudioContext();
    dentalPrep.classList.add("acting");
    sfx.equip();
    setTimeout(function(){
      dentalPrep.classList.remove("acting");
      if(selectedCategory === "teeth" && game.state === "prep1"){
        setState("prep2");
      }
    },650);
  }

  // ---------- 치아 케어: 정적 완료 이미지 + 누런 오버레이 + 독립 치석 타깃 ----------
  var dentalSourceCanvas = document.createElement("canvas");
  var dentalRevealCanvas = document.createElement("canvas");
  var dentalRevealCtx = dentalRevealCanvas.getContext("2d");
  var dentalCoreMaskCanvas = document.createElement("canvas");
  var dentalCoreMaskCtx = dentalCoreMaskCanvas.getContext("2d");
  var dentalCompositeCanvas = document.createElement("canvas");
  var dentalCompositeCtx = dentalCompositeCanvas.getContext("2d");
  var dentalDepositSourceCanvas = document.createElement("canvas");
  var dentalDepositSourceCtx = dentalDepositSourceCanvas.getContext("2d");
  var dentalToothMask = null;
  var dentalGridOwners = [];
  var dentalGridTotals = { upper:0, lower:0 };
  var dentalTouched = { upper:Object.create(null), lower:Object.create(null) };
  var dentalDistance = { upper:0, lower:0 };
  var dentalRenderQueued = false;
  var dentalDepositRenderQueued = false;
  var DENTAL_GRID_X = 44;
  var DENTAL_GRID_Y = 66;
  var dentalCanvasReady = false;
  var dentalDepositSourceReady = false;
  var DENTAL_DEPOSIT_TARGETS = [
    {x:.076,y:.267,rx:.058,ry:.056},{x:.144,y:.222,rx:.061,ry:.067},
    {x:.856,y:.222,rx:.061,ry:.067},{x:.924,y:.267,rx:.058,ry:.056},
    {x:.104,y:.673,rx:.066,ry:.062},{x:.164,y:.734,rx:.064,ry:.062},
    {x:.276,y:.795,rx:.058,ry:.056},{x:.724,y:.795,rx:.058,ry:.056},
    {x:.836,y:.734,rx:.064,ry:.062},{x:.896,y:.673,rx:.066,ry:.062}
  ];
  var dentalDepositState = [];

  function initDentalCanvas(){
    if(!dentalCleanImg.naturalWidth || !dentalCleanImg.naturalHeight || !dentalDirtyImg.naturalWidth) return;
    var width=dentalCleanImg.naturalWidth;
    var height=dentalCleanImg.naturalHeight;
    [dentalBeforeCanvas,dentalDepositLayer,dentalSourceCanvas,dentalRevealCanvas,dentalCoreMaskCanvas,dentalCompositeCanvas,dentalDepositSourceCanvas].forEach(function(canvas){
      canvas.width=width;
      canvas.height=height;
    });
    var cleanSampler=document.createElement("canvas");
    cleanSampler.width=width;
    cleanSampler.height=height;
    var cleanCtx=cleanSampler.getContext("2d",{willReadFrequently:true});
    cleanCtx.drawImage(dentalCleanImg,0,0,width,height);
    var cleanPixels=cleanCtx.getImageData(0,0,width,height).data;
    var candidate=new Uint8Array(width*height);
    var coreMask=new Uint8Array(width*height);
    var acceptedMask=new Uint8Array(width*height);
    var visited=new Uint8Array(width*height);
    var queue=new Int32Array(width*height);

    for(var y=0;y<height;y++){
      var ny=y/height;
      for(var x=0;x<width;x++){
        var nx=x/width,p=y*width+x,o=p*4;
        var r=cleanPixels[o],g=cleanPixels[o+1],b=cleanPixels[o+2],a=cleanPixels[o+3];
        var spread=Math.max(r,g,b)-Math.min(r,g,b);
        var lightFill=a>0 && r>125 && g>122 && b>118 && spread<120;
        var insideMouth=Math.pow((nx-.5)/.515,2)+Math.pow((ny-.488)/.426,2)<1.12;
        var dentalBand=(ny>.092&&ny<.368)||(ny>.596&&ny<.884);
        if(lightFill&&insideMouth) candidate[p]=1;
        if(lightFill&&insideMouth&&dentalBand) coreMask[p]=1;
      }
    }

    var neighbors=[-1,1,-width,width];
    var minComponent=Math.round(width*height*.0012);
    var maxComponent=Math.round(width*height*.022);
    for(var seed=0;seed<candidate.length;seed++){
      if(!candidate[seed]||visited[seed]) continue;
      var head=0,tail=0,sumY=0,touchesCore=false;
      queue[tail++]=seed;
      visited[seed]=1;
      while(head<tail){
        var pixel=queue[head++],px=pixel%width,py=(pixel/width)|0;
        sumY+=py;
        if(coreMask[pixel]) touchesCore=true;
        for(var ni=0;ni<neighbors.length;ni++){
          var step=neighbors[ni],next=pixel+step;
          if(next<0||next>=candidate.length||visited[next]||!candidate[next]) continue;
          if((step===-1&&px===0)||(step===1&&px===width-1)) continue;
          visited[next]=1;
          queue[tail++]=next;
        }
      }
      if(!touchesCore||tail<minComponent||tail>maxComponent) continue;
      var centerY=sumY/tail/height;
      if(!((centerY>.116&&centerY<.344)||(centerY>.62&&centerY<.836))) continue;
      for(var qi=0;qi<tail;qi++) acceptedMask[queue[qi]]=1;
    }

    dentalToothMask=acceptedMask;
    var maskImage=dentalCoreMaskCtx.createImageData(width,height);
    var tintImage=dentalBeforeCtx.createImageData(width,height);
    for(var tp=0;tp<acceptedMask.length;tp++){
      if(!acceptedMask[tp]) continue;
      var to=tp*4;
      maskImage.data[to]=255;
      maskImage.data[to+1]=255;
      maskImage.data[to+2]=255;
      maskImage.data[to+3]=255;
      // 원본 치아의 결·하이라이트는 아래 IMG에 그대로 두고 따뜻한 누런 색만 얹는다.
      tintImage.data[to]=226;
      tintImage.data[to+1]=164;
      tintImage.data[to+2]=36;
      tintImage.data[to+3]=104;
    }
    dentalCoreMaskCtx.clearRect(0,0,width,height);
    dentalCoreMaskCtx.putImageData(maskImage,0,0);
    var sourceCtx=dentalSourceCanvas.getContext("2d");
    sourceCtx.clearRect(0,0,width,height);
    sourceCtx.putImageData(tintImage,0,0);

    // 비포 원본에서 황금색 치석 픽셀만 뽑아 정확히 치아 사이에 겹친다.
    // 위치 마스크와 색 조건을 함께 써서 누런 치아·잇몸·검은 외곽선은 섞이지 않는다.
    cleanCtx.clearRect(0,0,width,height);
    cleanCtx.drawImage(dentalDirtyImg,0,0,width,height);
    var dirtyPixels=cleanCtx.getImageData(0,0,width,height).data;
    var depositImage=dentalDepositSourceCtx.createImageData(width,height);
    for(var dy=0;dy<height;dy++){
      var dny=dy/height;
      for(var dx=0;dx<width;dx++){
        var dnx=dx/width,insideDepositTarget=false;
        for(var di=0;di<DENTAL_DEPOSIT_TARGETS.length;di++){
          var dt=DENTAL_DEPOSIT_TARGETS[di];
          if(Math.pow((dnx-dt.x)/(dt.rx*.72),2)+Math.pow((dny-dt.y)/(dt.ry*.78),2)<=1){
            insideDepositTarget=true;
            break;
          }
        }
        if(!insideDepositTarget) continue;
        var dp=(dy*width+dx)*4;
        var dr=dirtyPixels[dp],dg=dirtyPixels[dp+1],db=dirtyPixels[dp+2],da=dirtyPixels[dp+3];
        var golden=dr>118&&dg>58&&db<132&&dr-dg>18&&dg-db>16;
        var deepGold=dr>72&&dg>34&&db<72&&dr-dg>15&&dg-db>5;
        if(!golden&&!deepGold) continue;
        depositImage.data[dp]=dr;
        depositImage.data[dp+1]=dg;
        depositImage.data[dp+2]=db;
        depositImage.data[dp+3]=da;
      }
    }
    dentalDepositSourceCtx.clearRect(0,0,width,height);
    dentalDepositSourceCtx.putImageData(depositImage,0,0);
    dentalDepositSourceReady=true;

    dentalGridOwners=new Array(DENTAL_GRID_X*DENTAL_GRID_Y).fill(null);
    dentalGridTotals={upper:0,lower:0};
    for(var gy=0;gy<DENTAL_GRID_Y;gy++){
      for(var gx=0;gx<DENTAL_GRID_X;gx++){
        var sampleX=Math.min(width-1,Math.round((gx+.5)/DENTAL_GRID_X*width));
        var sampleY=Math.min(height-1,Math.round((gy+.5)/DENTAL_GRID_Y*height));
        if(!acceptedMask[sampleY*width+sampleX]) continue;
        var owner=sampleY/height<.5?"upper":"lower";
        dentalGridOwners[gy*DENTAL_GRID_X+gx]=owner;
        dentalGridTotals[owner]++;
      }
    }
    cleanSampler.width=cleanSampler.height=1;
    dentalCanvasReady=true;
    resetDentalCanvas();
  }

  function resetDentalDeposits(){
    dentalDepositState=DENTAL_DEPOSIT_TARGETS.map(function(){
      return {wear:0,travel:0,cleared:false};
    });
    requestDentalDepositRender();
  }

  function updateDentalDepositNode(index){
    if(!dentalDepositState[index]) return;
    requestDentalDepositRender();
  }

  function renderDentalDepositCanvas(){
    if(!dentalDepositSourceReady) return;
    var width=dentalDepositLayer.width,height=dentalDepositLayer.height;
    dentalDepositCtx.clearRect(0,0,width,height);
    dentalDepositCtx.globalCompositeOperation="source-over";
    dentalDepositCtx.globalAlpha=1;
    dentalDepositCtx.drawImage(dentalDepositSourceCanvas,0,0);
    dentalDepositCtx.globalCompositeOperation="destination-out";
    dentalDepositState.forEach(function(state,index){
      if(!state||state.wear<=0) return;
      var target=DENTAL_DEPOSIT_TARGETS[index];
      dentalDepositCtx.save();
      dentalDepositCtx.globalAlpha=Math.min(1,state.wear*1.08);
      dentalDepositCtx.beginPath();
      dentalDepositCtx.ellipse(target.x*width,target.y*height,target.rx*width*.78,target.ry*height*.84,0,0,Math.PI*2);
      dentalDepositCtx.fill();
      dentalDepositCtx.restore();
    });
    dentalDepositCtx.globalAlpha=1;
    dentalDepositCtx.globalCompositeOperation="source-over";
  }

  function requestDentalDepositRender(){
    if(dentalDepositRenderQueued) return;
    dentalDepositRenderQueued=true;
    requestAnimationFrame(function(){
      dentalDepositRenderQueued=false;
      renderDentalDepositCanvas();
    });
  }

  function resetDentalCanvas(){
    dentalTouched={upper:Object.create(null),lower:Object.create(null)};
    dentalDistance={upper:0,lower:0};
    resetDentalDeposits();
    if(!dentalCanvasReady) return;
    dentalRevealCtx.clearRect(0,0,dentalRevealCanvas.width,dentalRevealCanvas.height);
    renderDentalBeforeCanvas();
  }

  function renderDentalBeforeCanvas(){
    if(!dentalCanvasReady) return;
    var width=dentalBeforeCanvas.width,height=dentalBeforeCanvas.height;
    dentalBeforeCtx.clearRect(0,0,width,height);
    dentalBeforeCtx.globalCompositeOperation="source-over";
    dentalBeforeCtx.drawImage(dentalSourceCanvas,0,0);
    dentalCompositeCtx.clearRect(0,0,width,height);
    dentalCompositeCtx.globalCompositeOperation="source-over";
    dentalCompositeCtx.drawImage(dentalRevealCanvas,0,0);
    dentalCompositeCtx.globalCompositeOperation="destination-in";
    dentalCompositeCtx.drawImage(dentalCoreMaskCanvas,0,0);
    dentalBeforeCtx.globalCompositeOperation="destination-out";
    dentalBeforeCtx.drawImage(dentalCompositeCanvas,0,0);
    dentalBeforeCtx.globalCompositeOperation="source-over";
    dentalCompositeCtx.globalCompositeOperation="source-over";
  }

  function requestDentalBeforeRender(){
    if(dentalRenderQueued) return;
    dentalRenderQueued=true;
    requestAnimationFrame(function(){
      dentalRenderQueued=false;
      renderDentalBeforeCanvas();
    });
  }

  function dentalClientToCanvas(clientX,clientY){
    var rect=dentalBeforeCanvas.getBoundingClientRect();
    if(!rect.width||!rect.height) return null;
    return {
      x:(clientX-rect.left)/rect.width*dentalBeforeCanvas.width,
      y:(clientY-rect.top)/rect.height*dentalBeforeCanvas.height
    };
  }

  function dentalMaskAt(x,y,action){
    var width=dentalBeforeCanvas.width,height=dentalBeforeCanvas.height;
    var ix=Math.max(0,Math.min(width-1,Math.round(x)));
    var iy=Math.max(0,Math.min(height-1,Math.round(y)));
    if(action==="upper"&&iy>=height*.5) return false;
    if(action==="lower"&&iy<height*.5) return false;
    return !!(dentalToothMask&&dentalToothMask[iy*width+ix]);
  }

  function paintDentalRevealPoint(x,y,action){
    if(!dentalCanvasReady||["upper","lower"].indexOf(action)===-1) return false;
    if(!dentalMaskAt(x,y,action)) return false;
    var radius=dentalBeforeCanvas.width*.055;
    var gradient=dentalRevealCtx.createRadialGradient(x,y,0,x,y,radius);
    gradient.addColorStop(0,"rgba(255,255,255,1)");
    gradient.addColorStop(.82,"rgba(255,255,255,1)");
    gradient.addColorStop(1,"rgba(255,255,255,0)");
    dentalRevealCtx.fillStyle=gradient;
    dentalRevealCtx.beginPath();
    dentalRevealCtx.arc(x,y,radius,0,Math.PI*2);
    dentalRevealCtx.fill();
    var gxMin=Math.max(0,Math.floor((x-radius)/dentalBeforeCanvas.width*DENTAL_GRID_X));
    var gxMax=Math.min(DENTAL_GRID_X-1,Math.ceil((x+radius)/dentalBeforeCanvas.width*DENTAL_GRID_X));
    var gyMin=Math.max(0,Math.floor((y-radius)/dentalBeforeCanvas.height*DENTAL_GRID_Y));
    var gyMax=Math.min(DENTAL_GRID_Y-1,Math.ceil((y+radius)/dentalBeforeCanvas.height*DENTAL_GRID_Y));
    for(var gy=gyMin;gy<=gyMax;gy++){
      for(var gx=gxMin;gx<=gxMax;gx++){
        var index=gy*DENTAL_GRID_X+gx;
        if(dentalGridOwners[index]!==action||dentalTouched[action][index]) continue;
        var cx=(gx+.5)/DENTAL_GRID_X*dentalBeforeCanvas.width;
        var cy=(gy+.5)/DENTAL_GRID_Y*dentalBeforeCanvas.height;
        if(Math.hypot(cx-x,cy-y)<=radius*.78) dentalTouched[action][index]=true;
      }
    }
    return true;
  }

  function applyDentalEdgeSegment(from,to){
    var width=dentalBeforeCanvas.width,height=dentalBeforeCanvas.height;
    var canvasDistance=Math.hypot(to.x-from.x,to.y-from.y);
    if(canvasDistance<=0) return false;
    var steps=Math.max(1,Math.ceil(canvasDistance/8));
    var hitCounts=new Uint16Array(DENTAL_DEPOSIT_TARGETS.length);
    for(var i=0;i<=steps;i++){
      var t=i/steps,nx=(from.x+(to.x-from.x)*t)/width,ny=(from.y+(to.y-from.y)*t)/height;
      DENTAL_DEPOSIT_TARGETS.forEach(function(target,index){
        var state=dentalDepositState[index];
        if(state.cleared) return;
        var distance=Math.pow((nx-target.x)/target.rx,2)+Math.pow((ny-target.y)/target.ry,2);
        if(distance<=1) hitCounts[index]++;
      });
    }
    var changed=false;
    hitCounts.forEach(function(count,index){
      if(!count) return;
      var state=dentalDepositState[index];
      state.travel+=(canvasDistance/width)*(count/(steps+1));
      while(state.travel>=.018&&!state.cleared){
        state.travel-=.018;
        state.wear=Math.min(1,state.wear+.14);
        changed=true;
        if(state.wear>=1){
          state.cleared=true;
          sfx.pluck();
        }
      }
      updateDentalDepositNode(index);
    });
    if(changed){
      var total=dentalDepositState.reduce(function(sum,state){return sum+state.wear;},0);
      game.dental.edge=total/dentalDepositState.length*100;
    }
    return changed;
  }

  function applyDentalBrushSegment(fromClientX,fromClientY,toClientX,toClientY,action,clientDistance){
    if(!dentalCanvasReady) return;
    var from=dentalClientToCanvas(fromClientX,fromClientY);
    var to=dentalClientToCanvas(toClientX,toClientY);
    if(!from||!to) return;
    if(action==="edge"){
      applyDentalEdgeSegment(from,to);
      return;
    }
    var canvasDistance=Math.hypot(to.x-from.x,to.y-from.y);
    var steps=Math.max(1,Math.ceil(canvasDistance/7));
    var validSamples=0;
    for(var i=0;i<=steps;i++){
      var t=i/steps;
      if(paintDentalRevealPoint(from.x+(to.x-from.x)*t,from.y+(to.y-from.y)*t,action)) validSamples++;
    }
    if(!validSamples) return;
    dentalDistance[action]+=(clientDistance||0)*(validSamples/(steps+1));
    var covered=Object.keys(dentalTouched[action]).length/Math.max(1,dentalGridTotals[action]);
    var coverageProgress=Math.min(1,covered/DENTAL_COVERAGE_TARGET[action]);
    var distanceProgress=Math.min(1,dentalDistance[action]/DENTAL_DRAG_DISTANCE[action]);
    game.dental[action]=Math.min(100,Math.min(coverageProgress,distanceProgress)*100);
    requestDentalBeforeRender();
  }

  var pawPadPath = null;

  function buildPawPadPath(){
    var w = pawBeforeCanvas.width;
    var h = pawBeforeCanvas.height;
    var p = new Path2D();
    [
      [.205,.405,.091,.122],
      [.392,.258,.088,.128],
      [.608,.258,.088,.128],
      [.795,.405,.091,.122]
    ].forEach(function(v){
      p.ellipse(v[0]*w,v[1]*h,v[2]*w,v[3]*h,0,0,Math.PI*2);
    });
    p.moveTo(.255*w,.748*h);
    p.bezierCurveTo(.205*w,.625*h,.292*w,.432*h,.5*w,.405*h);
    p.bezierCurveTo(.708*w,.432*h,.795*w,.625*h,.745*w,.748*h);
    p.bezierCurveTo(.665*w,.822*h,.335*w,.822*h,.255*w,.748*h);
    p.closePath();
    pawPadPath = p;

    pawTargetCellCount = 0;
    for(var gy=0;gy<PAW_GRID;gy++){
      for(var gx=0;gx<PAW_GRID;gx++){
        if(pawBeforeCtx.isPointInPath(p,(gx+.5)*w/PAW_GRID,(gy+.5)*h/PAW_GRID)){
          pawTargetCellCount++;
        }
      }
    }
  }

  function drawPawBefore(){

  function pawCanvasPoint(clientX,clientY){
    var rect = pawBeforeCanvas.getBoundingClientRect();
    return {
      x:(clientX-rect.left) * pawBeforeCanvas.width / rect.width,
      y:(clientY-rect.top) * pawBeforeCanvas.height / rect.height,
      inside:clientX>=rect.left && clientX<=rect.right && clientY>=rect.top && clientY<=rect.bottom
    };
  }

  function markPawCoverage(x,y,radius){
    var w = pawBeforeCanvas.width;
    var h = pawBeforeCanvas.height;
    var minX = Math.max(0,Math.floor((x-radius)/w*PAW_GRID));
    var maxX = Math.min(PAW_GRID-1,Math.ceil((x+radius)/w*PAW_GRID));
    var minY = Math.max(0,Math.floor((y-radius)/h*PAW_GRID));
    var maxY = Math.min(PAW_GRID-1,Math.ceil((y+radius)/h*PAW_GRID));
    for(var gy=minY;gy<=maxY;gy++){
      for(var gx=minX;gx<=maxX;gx++){
        var cx=(gx+.5)*w/PAW_GRID;
        var cy=(gy+.5)*h/PAW_GRID;
        if(Math.hypot(cx-x,cy-y)<=radius && pawBeforeCtx.isPointInPath(pawPadPath,cx,cy)){
          game.paw.touched[gx+":"+gy]=true;
        }
      }
    }
  }

  function erasePawBeforeAt(clientX,clientY,dragDistance){
    var point = pawCanvasPoint(clientX,clientY);
    if(!point.inside || !pawPadPath || !pawBeforeCtx.isPointInPath(pawPadPath,point.x,point.y)) return;
    var radius = 86;
    var gradient = pawBeforeCtx.createRadialGradient(point.x,point.y,18,point.x,point.y,radius);
    gradient.addColorStop(0,"rgba(0,0,0,1)");
    gradient.addColorStop(.72,"rgba(0,0,0,.94)");
    gradient.addColorStop(1,"rgba(0,0,0,0)");
    pawBeforeCtx.save();
    pawBeforeCtx.clip(pawPadPath);
    pawBeforeCtx.globalCompositeOperation = "destination-out";
    pawBeforeCtx.fillStyle = gradient;
    pawBeforeCtx.beginPath();
    pawBeforeCtx.arc(point.x,point.y,radius,0,Math.PI*2);
    pawBeforeCtx.fill();
    pawBeforeCtx.restore();

    markPawCoverage(point.x,point.y,radius*.82);
    game.paw.balmDistance += dragDistance;
    var coverage = pawTargetCellCount ? Object.keys(game.paw.touched).length / pawTargetCellCount : 0;
    game.paw.balm = Math.min(100,Math.min(coverage/.82,game.paw.balmDistance/1500)*100);
    spawnPawHoneyTrace(clientX,clientY);
    pawSfxAcc += dragDistance;
    if(pawSfxAcc >= 90){
      pawSfxAcc %= 90;
      sfx.rub();
    }
    if(game.paw.balm >= 100 && game.state === "prep2"){
      pawBeforeCtx.clearRect(0,0,pawBeforeCanvas.width,pawBeforeCanvas.height);
      setState("stage1");
    }

  function updatePawMassage(clientX,clientY,moveDistance){
    if(activePawTarget == null) return;
    var target = game.paw.targets[activePawTarget];
    var center = pawTargetCenter(activePawTarget);
    var radius = Math.hypot(clientX-center.x,clientY-center.y);
    var minRadius = Math.max(7,center.size*.018);
    var maxRadius = Math.max(32,center.size*.105);
    var angle = Math.atan2(clientY-center.y,clientX-center.x);
    if(radius >= minRadius && radius <= maxRadius && pawLastMassageAngle != null){
      var delta = angle - pawLastMassageAngle;
      while(delta > Math.PI) delta -= Math.PI*2;
      while(delta < -Math.PI) delta += Math.PI*2;
      if(Math.abs(delta) <= .9){
        target.angleTravel += Math.abs(delta);
        target.distance += moveDistance;
        target.progress = Math.min(100,Math.min(target.angleTravel/PAW_MASSAGE_ANGLE,target.distance/PAW_MASSAGE_DISTANCE)*100);
        pawSfxAcc += moveDistance;
        if(pawSfxAcc >= 70){ pawSfxAcc %= 70; sfx.rub(); }
        pawCreamAcc += moveDistance;
        if(pawCreamAcc >= 14){
          pawCreamAcc %= 14;
          spawnPawCreamStreak(clientX,clientY,angle);
        }
      }
    }
    pawLastMassageAngle = angle;
    if(target.progress >= 100 && !target.removed){
      target.removed = true;
      clearPawCreamDollop(activePawTarget);
      spawnPawMassageRing(activePawTarget);
      sfx.pluck();
      activePawTarget = null;
      activePawAction = null;
      game.isDragging = false;
      activePointerId = null;

      pawShikonCursor.classList.remove("visible");
      if(game.paw.targets.every(function(item){ return item.removed; })){
        setState("complete");
      }
    }
  }

  function findNearestChinTarget(clientX,clientY,stage){
    var rect=gameStage.getBoundingClientRect();
    var px=(clientX-rect.left)/rect.width, py=(clientY-rect.top)/rect.height;
    var best=null,bestDistance=Infinity;
    CHIN_TARGET_CONFIG.forEach(function(target,index){
      var state=game.chin.targets[index];
      if(stage==="stage1" && state.rub>=100) return;
      if(stage==="stage2" && (state.rub<100 || state.brush>=100)) return;
      var distance=Math.hypot(px-target.x,py-target.y);
      if(distance<=target.r+0.025 && distance<bestDistance){ best=index; bestDistance=distance; }
    });
    return best;
  }

  function updateChinProgress(stage,clientX,clientY,distance){
    var nearest=findNearestChinTarget(clientX,clientY,stage);

    if(activeChinTarget!==nearest){ activeChinTarget=nearest; return; }
    var target=game.chin.targets[nearest];
    var key=stage==="stage1" ? "rub" : "brush";
    var before=target[key];
    target[key]=Math.min(100,before+(Math.min(distance,26)/CHIN_TARGET_TRAVEL[stage])*100);
    if(before<100 && target[key]>=100){
      if(stage==="stage1"){
        addPadStain();
        sfx.rub();

        var rect=gameStage.getBoundingClientRect(), config=CHIN_TARGET_CONFIG[nearest];
        spawnBlackheadParticle(clientX,clientY,rect.left+config.x*rect.width,rect.top+config.y*rect.height);
      }
    }
    game.progress[stage]=game.chin.targets.reduce(function(sum,item){ return sum+item[key]; },0)/game.chin.targets.length;
  }

  // 이미지 속 실제 칫솔모 중심을 접촉점으로 환산해 소프트/엣지 판정에 공통 사용한다.
  function getDentalBrushHeadPoint(clientX,clientY,action){
    var style=window.getComputedStyle(toolCursor);

    var drawnHeight=imageHeight*scale;
    var anchor=action==="edge" ? {x:.475,y:.025} : {x:.50,y:.025};
    return {
      x:clientX+marginLeft+(width-drawnWidth)/2+drawnWidth*anchor.x,

    };

      var sdist=Math.hypot(sdx,sdy);
      lastX=e.clientX;
      lastY=e.clientY;
      updatePawMassage(e.clientX,e.clientY,sdist);
      movePawShikonCursor(e.clientX,e.clientY);

      var eyeDy = e.clientY - eyeLastCombY;
      eyeLastCombX = e.clientX;
      eyeLastCombY = e.clientY;
      moveEyeCombCursor(e.clientX,e.clientY);
      if(activeEyeCombMode === "groom"){
        var eyeDirection = game.eye.side === "right" ? 1 : -1;
        var directionalAdvance = eyeDx * eyeDirection;
        var followsTeeth = directionalAdvance > 0 && Math.abs(eyeDx) >= Math.abs(eyeDy) * 0.65;
        catchEyeCrustWithTeeth(e.clientX,e.clientY,followsTeeth ? directionalAdvance : 0);
        updateCaughtEyeCrust();
        // 빗질 드래그 자체의 질감음(brush 키 재사용 — 턱드름 stage2/치아 브러싱과 같은 소리로 통일)
        eyeSfxAcc += Math.abs(eyeDx);
        if(eyeSfxAcc >= EYE_SFX_STEP){
          eyeSfxAcc -= EYE_SFX_STEP;
          sfx.combEye();
        }
      }
      e.preventDefault();
      return;
    }

    if(selectedCategory === "fur" && activeFurAction){
      var fdx = e.clientX - lastX;
      var fdy = e.clientY - lastY;
      var fdist = Math.hypot(fdx,fdy);
      lastX = e.clientX;
      lastY = e.clientY;
      var furRect = furHitbox.getBoundingClientRect();
      var furInside = e.clientX >= furRect.left && e.clientX <= furRect.right &&
                      e.clientY >= furRect.top && e.clientY <= furRect.bottom;
      var furTargetHit=furInside;
      if(activeFurAction === "wet") furTargetHit=furWaterTouchesCoco(e.clientX,e.clientY);
      else if(activeFurAction === "rinse") furTargetHit=furWaterTouchesFoamArea(e.clientX,e.clientY);
      else if(activeFurAction === "towel") furTargetHit=furTowelTouchesCoco(e.clientX,e.clientY);
      if(furTargetHit){
        var furDelta = (fdist / designPx(FUR_DRAG_DISTANCE[activeFurAction])) * 100;
        applyFurDrag(activeFurAction,furDelta,e.clientX,e.clientY);
      }else if(activeFurAction === "wet" || activeFurAction === "towel"){
        clearFurCarePrevious(activeFurAction);
      }
      moveToolCursor(e.clientX,e.clientY);
      scheduleRender();
      e.preventDefault();
      return;
    }

    if(selectedCategory === "teeth" && activeDentalAction){
      var dentalPrevX = lastX;
      var dentalPrevY = lastY;
      var ddx = e.clientX - lastX;
      var ddy = e.clientY - lastY;
      var ddist = Math.hypot(ddx,ddy);
      lastX = e.clientX;
      lastY = e.clientY;
      var dentalPrevHead=getDentalBrushHeadPoint(dentalPrevX,dentalPrevY,activeDentalAction);
      var dentalHead=getDentalBrushHeadPoint(e.clientX,e.clientY,activeDentalAction);
      var dentalRect = dentalZone.getBoundingClientRect();
      var dentalInside = dentalHead.x >= dentalRect.left && dentalHead.x <= dentalRect.right &&
                         dentalHead.y >= dentalRect.top && dentalHead.y <= dentalRect.bottom;
      if(dentalInside){
        var beforeProgress=game.dental[activeDentalAction];
        applyDentalBrushSegment(
          dentalPrevHead.x,dentalPrevHead.y,
          dentalHead.x,dentalHead.y,
          activeDentalAction,ddist
        );
        if(Math.floor(game.dental[activeDentalAction]) % 7 < game.dental[activeDentalAction]-beforeProgress){
          sfx.brushTeeth();
        }
      }
      moveToolCursor(e.clientX,e.clientY);
      scheduleRender();
      if(game.dental[activeDentalAction] >= 100){
        finishDentalRow(activeDentalAction);
        activeDentalAction = null;
        advanceState();
      }
      e.preventDefault();
      return;
    }

    var stage = game.state;
    if(stage !== "stage1" && stage !== "stage2") return;

    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    var dist = Math.hypot(dx, dy);
    lastX = e.clientX;
    lastY = e.clientY;

    var beforeChinProgress=game.progress[stage];
    updateChinProgress(stage,e.clientX,e.clientY,dist);
    var delta=game.progress[stage]-beforeChinProgress;
    if(delta>0){
      sfxAcc[stage] += delta;
      if(sfxAcc[stage] >= SFX_STEP[stage]){
        sfxAcc[stage] -= SFX_STEP[stage];
        if(stage === "stage1"){ sfx.rub(); } else { sfx.brushChin(); }
      }

    }

    moveToolCursor(e.clientX, e.clientY);
    scheduleRender();

    if(game.progress[stage] >= 100){
      advanceState();
    }
  }

  function onPointerUp(e){

    activeFurAction = null;

    activePawAction = null;
    activePawTarget = null;
    activeChinTarget = null;

        rinse:game.fur.rinse,
        towel:game.fur.towel,
        mist:0,
        brush:game.fur.brush,
        eject:100,
        complete:100
      };
      currentStageProgress = furProgressMap[furAction] || 0;
    }else if(isEye){
      currentStageProgress = (totalRemovedEyeCrusts() / 6) * 100;
    }else if(isDental){
      var dentalAction = getDentalAction();
      currentStageProgress = dentalAction === "gel"
        ? 0
        : (dentalAction === "complete" ? 100 : game.dental[dentalAction]);
    }else if(isPaw){
      if(game.state === "prep1" || game.state === "stage1"){
        currentStageProgress = 0;
      }else if(game.state === "prep2"){
        currentStageProgress = game.paw.balm;
      }else if(game.state === "stage2"){
        currentStageProgress = game.paw.targets.reduce(function(sum,target){ return sum+target.progress; },0) / game.paw.targets.length;
      }else{
        currentStageProgress = 100;
      }
    }else{
      currentStageProgress = (game.state === "stage1" || game.state === "stage2")
        ? game.progress[game.state]
        : (game.state === "complete" ? 100 : 0);
    }
    progressFill.style.width = currentStageProgress + "%";

    var stateIdx = STATE_ORDER.indexOf(game.state);
    Object.keys(dots).forEach(function(stage){

      dots[stage].classList.toggle("done", stageIdx < stateIdx || game.state === "complete");

            ? ({

                complete:""
              }[game.state] || "")
            : (CHIN_INSTRUCTIONS[game.state] || ""))));

    var hintAction = isFur ? getFurAction() : (isDental ? getDentalAction() : "");

      (isChin && (game.state === "stage1" || game.state === "stage2")) ||
      (isPaw && (game.state === "prep2" || game.state === "stage2")) ||
      (isEye && game.eye.combPicked && game.state !== "complete") ||
      (isDental && ["edge","upper","lower"].indexOf(hintAction) !== -1) ||
      (isFur && ["wet","lather","rinse","towel","brush"].indexOf(hintAction) !== -1);
    gameStage.classList.toggle("show-game-hint",showGameHint && !gameHintEngaged);

    // 준비용 탭/제품 선택 중에는 진행도를 숨기고 실제 플레이 조작에서만 표시한다.
    var showProgress =
      (isChin && (game.state === "stage1" || game.state === "stage2")) ||
      (isPaw && (game.state === "prep2" || game.state === "stage2")) ||
      (isEye && game.eye.combPicked && game.state !== "complete") ||
      (isDental && ["edge","upper","lower"].indexOf(hintAction) !== -1) ||
      (isFur && ["wet","lather","rinse","towel","brush"].indexOf(hintAction) !== -1);
    gameStage.classList.toggle("show-progress",showProgress);
    gameStage.classList.toggle("compact-play-ui",showProgress);

    gameStage.classList.toggle("stage-complete", game.state === "complete");
    completeBadge.classList.toggle("show", game.state === "complete");
    var productUrl = CARE_PRODUCT_URLS[selectedCategory] || "#";
    ctaBtn.setAttribute("href", productUrl);
    ctaBtn.setAttribute("data-cta-url", productUrl);
    ctaBtn.classList.toggle("show", game.state === "complete");
    restartBtn.classList.toggle("show", game.state === "complete");
    ctaBtn.textContent = (isFur || isEye || isDental || isPaw) ? "Shop Products" : "Shop Now";
  }

  game.chin.targets = CHIN_TARGET_CONFIG.map(function(){ return { rub:0, brush:0 }; });
  loadCareProgress();
  render();
})();
</script>

</body>
</html>
