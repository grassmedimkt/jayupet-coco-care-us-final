<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JAYUPET × Coco — Care Time</title>
<style>
  :root{
    --brand-red: #C31F26;
    --bg-ivory: #FFFDF6;
    --panel-ivory: #FFF8EC;
    --line-gray: #8A8378;
    /* 프레임 폭/높이 3-way min() 계산에 쓰는 여백값. body padding과 반드시 동일하게 유지 */
    --pad-h: calc(max(12px, env(safe-area-inset-left)) + max(12px, env(safe-area-inset-right)));
    --pad-v: calc(max(16px, env(safe-area-inset-top)) + max(16px, env(safe-area-inset-bottom)));
    /* 프레임 위/아래에 실제로 차지하는 다른 UI(헤더/푸터/gap) 높이 예상치. 정확한 px보다 약간 넉넉하게 잡아 shortfall 시에도 max-height:760px 미디어쿼리의 스크롤 폴백이 안전망 역할을 하도록 함 */
    --hub-chrome-h: 64px;   /* header(~40px) + app gap(18px) */
    --game-chrome-h: 72px; /* 하단 HUD를 게임 카드 안으로 통합한 뒤 남는 헤더+간격 */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{
    height:100%;
    overscroll-behavior:none;
  }
  img{
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    overscroll-behavior:none;
    background:var(--bg-ivory);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#2B2620;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      max(16px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }
  .app{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* ---------- header ---------- */
  .brand-header{ text-align:center; }
  .brand-mark{
    font-size:calc(15 * var(--ui-unit));
    letter-spacing:0.14em;
    font-weight:700;
    color:#2B2620;
  }
  .brand-mark .x{ color:var(--brand-red); margin:0 calc(4 * var(--ui-unit)); }
  .accent-line{
    width:calc(56 * var(--ui-unit));
    height:calc(3 * var(--ui-unit));
    background:var(--brand-red);
    margin:calc(10 * var(--ui-unit)) auto 0;
    border-radius:calc(2 * var(--ui-unit));
  }

  /* ---------- main care hub ---------- */
  .hub-screen{
    position:relative;
    /* width/height 독립 캡(min/max-height) 대신 3-way min()으로 폭 하나만 결정 → 비율이 항상 4:5로 고정됨 */
    width:min(
      calc(480 * var(--ui-unit)),
      calc(100vw - var(--pad-h)),
      calc((100dvh - var(--pad-v) - var(--hub-chrome-h)) * 4 / 5)
    );
    margin-left:auto;
    margin-right:auto;
    aspect-ratio:4 / 5;
    container-type:inline-size;
    border:calc(1 * var(--ui-unit)) solid #EFE6D8;
    border-radius:calc(20 * var(--ui-unit));
    overflow:hidden;
    background:
      linear-gradient(rgba(255,255,255,0.48), rgba(255,255,255,0.1)),
      repeating-linear-gradient(0deg, transparent 0 calc(54 * var(--ui-unit)), rgba(195,31,38,0.055) calc(54 * var(--ui-unit)) calc(56 * var(--ui-unit))),
      repeating-linear-gradient(90deg, transparent 0 calc(54 * var(--ui-unit)), rgba(195,31,38,0.055) calc(54 * var(--ui-unit)) calc(56 * var(--ui-unit))),
      #F7EBDD;
    box-shadow:0 calc(8 * var(--ui-unit)) calc(24 * var(--ui-unit)) rgba(0,0,0,0.06);
  }
  .hub-screen[hidden],
  .game-only[hidden]{ display:none !important; }
  .hub-topbar{
    position:absolute;
    z-index:12;
    top:calc(14 * var(--ui-unit));
    left:calc(14 * var(--ui-unit));
    right:calc(14 * var(--ui-unit));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:calc(10 * var(--ui-unit));
  }
  .hub-progress{
    display:flex;
    align-items:center;
    gap:calc(8 * var(--ui-unit));
    padding:calc(8 * var(--ui-unit)) calc(12 * var(--ui-unit));
    border:calc(1 * var(--ui-unit)) solid rgba(195,31,38,0.16);
    border-radius:calc(999 * var(--ui-unit));
    background:rgba(255,253,246,0.9);
    -webkit-backdrop-filter:blur(calc(6 * var(--ui-unit)));
    backdrop-filter:blur(calc(6 * var(--ui-unit)));
    font-size:calc(12 * var(--ui-unit));
    font-weight:700;
    color:#4A443B;
    box-shadow:0 calc(3 * var(--ui-unit)) calc(10 * var(--ui-unit)) rgba(0,0,0,0.06);
  }
  .hub-progress strong{ color:var(--brand-red); }
  .sound-btn{
    width:calc(38 * var(--ui-unit));
    height:calc(38 * var(--ui-unit));
    border:calc(1 * var(--ui-unit)) solid rgba(195,31,38,0.2);
    border-radius:50%;
    background:rgba(255,253,246,0.92);
    color:var(--brand-red);
    font-size:calc(18 * var(--ui-unit));
    cursor:pointer;
    box-shadow:0 calc(3 * var(--ui-unit)) calc(10 * var(--ui-unit)) rgba(0,0,0,0.07);
  }
  .sound-btn.muted{ color:#8A8378; }
  .hub-room-decor{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .hub-mirror{
    position:absolute;
    left:7%;
    top:9%;
    width:57%;
    height:64%;
    border:calc(8 * var(--ui-unit)) solid rgba(255,253,246,0.9);
    border-radius:48% 48% calc(22 * var(--ui-unit)) calc(22 * var(--ui-unit));
    background:linear-gradient(145deg,rgba(201,238,243,0.72),rgba(255,255,255,0.32));
    box-shadow:inset 0 0 0 calc(2 * var(--ui-unit)) rgba(138,131,120,0.14), 0 calc(6 * var(--ui-unit)) calc(16 * var(--ui-unit)) rgba(75,62,47,0.08);
  }
  .hub-shelf{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:22%;
    background:linear-gradient(#E8D1B8 0 11%, #FFF8EC 11% 100%);
    border-top:calc(1 * var(--ui-unit)) solid rgba(138,131,120,0.18);
  }
  .hub-shelf::before{
    content:"";
    position:absolute;
    left:8%;
    top:28%;
    width:18%;
    height:42%;
    border-radius:calc(10 * var(--ui-unit)) calc(10 * var(--ui-unit)) calc(3 * var(--ui-unit)) calc(3 * var(--ui-unit));
    background:linear-gradient(90deg,#D9B99A,#F0D9BE);
    box-shadow:0 calc(4 * var(--ui-unit)) calc(8 * var(--ui-unit)) rgba(0,0,0,0.08);
  }
  .hub-coco{
    position:absolute;
    z-index:3;
    left:0;
    bottom:12%;
    width:68%;
    height:78%;
    pointer-events:none;
  }
  .hub-coco-img,
  .hub-coco-complete{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center bottom;
    transition:opacity 560ms ease, transform 760ms cubic-bezier(.2,.9,.25,1), filter 560ms ease;
  }
  .hub-coco-img{
    filter:drop-shadow(0 calc(8 * var(--ui-unit)) calc(10 * var(--ui-unit)) rgba(69,46,34,0.14)) saturate(0.88);
  }
  .hub-coco-complete{
    z-index:5;
    opacity:0;
    transform:translateY(3%) scale(0.86);
    filter:drop-shadow(0 calc(10 * var(--ui-unit)) calc(15 * var(--ui-unit)) rgba(83,54,31,0.18)) saturate(1.08);
  }
  .hub-coco.all-complete .hub-coco-img{
    opacity:0;
    transform:scale(0.92);
    filter:blur(calc(4 * var(--ui-unit))) saturate(1);
  }
  .hub-coco.all-complete .hub-coco-complete{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .hub-magic{
    position:absolute;
    z-index:7;
    inset:4% -2%;
    opacity:0;
    pointer-events:none;
  }
  .hub-coco.celebrate .hub-magic{ animation:hubMagicFade 1450ms ease-out both; }
  .hub-magic::before,
  .hub-magic::after{
    content:"✦";
    position:absolute;
    color:#FFD95A;
    font-size:calc(26 * var(--ui-unit));
    text-shadow:
      calc(-92 * var(--ui-unit)) calc(54 * var(--ui-unit)) 0 #FFF2A9,
      calc(105 * var(--ui-unit)) calc(24 * var(--ui-unit)) 0 #FF9EB5,
      calc(-72 * var(--ui-unit)) calc(184 * var(--ui-unit)) 0 #AEE8FF,
      calc(88 * var(--ui-unit)) calc(210 * var(--ui-unit)) 0 #FFF2A9,
      calc(-28 * var(--ui-unit)) calc(300 * var(--ui-unit)) 0 #FFB7C8,
      calc(112 * var(--ui-unit)) calc(350 * var(--ui-unit)) 0 #BDEBFF;
  }
  .hub-magic::before{ left:48%; top:12%; animation:hubMagicSpin 1000ms ease-out both; }
  .hub-magic::after{ left:42%; top:28%; transform:scale(0.65) rotate(20deg); animation:hubMagicSpin 1200ms 100ms ease-out both; }
  @keyframes hubMagicFade{
    0%{ opacity:0; }
    18%,72%{ opacity:1; }
    100%{ opacity:0; }
  }
  @keyframes hubMagicSpin{
    0%{ transform:scale(0.2) rotate(-35deg); }
    55%{ transform:scale(1.15) rotate(8deg); }
    100%{ transform:scale(0.9) rotate(18deg); }
  }
  .condition-layer{
    position:absolute;
    z-index:4;
    transition:opacity 300ms ease, transform 300ms ease;
  }
  .condition-layer.cleaned{
    opacity:0;
    transform:scale(0.75);
  }
  .dirty-eyes{
    left:27%;
    top:41.6%;
    width:46%;
    height:7%;
  }
  .dirty-eyes::before,
  .dirty-eyes::after{
    content:"";
    position:absolute;
    bottom:0;
    width:20%;
    aspect-ratio:389 / 143;
    background:url("asset/images/eye-crust.png") center / contain no-repeat;
    filter:drop-shadow(0 calc(1 * var(--ui-unit)) calc(1 * var(--ui-unit)) rgba(83,49,31,0.18));
  }
  .dirty-eyes::before{ left:2%; transform:rotate(-12deg); }
  .dirty-eyes::after{ right:11%; transform:scaleX(-1) rotate(-12deg); }
  .dirty-teeth{
    left:48%;
    top:50%;
    width:26%;
    height:8%;
  }
  .dirty-teeth::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    aspect-ratio:1723 / 407;
    background:url("asset/images/bad-breath.png") center / contain no-repeat;
    transform-origin:50% 50%;
    animation:badBreathFloat 2.2s ease-in-out infinite;
    filter:drop-shadow(0 calc(2 * var(--ui-unit)) calc(2 * var(--ui-unit)) rgba(105,116,54,0.12));
  }
  @keyframes badBreathFloat{
    0%,100%{ opacity:0.68; transform:translate(0,calc(1 * var(--ui-unit))) scaleX(-1) scale(0.96); }
    50%{ opacity:0.88; transform:translate(calc(3 * var(--ui-unit)),calc(-2 * var(--ui-unit))) scaleX(-1) scale(1); }
  }
  .dirty-chin{
    left:38%;
    top:49%;
    width:27%;
    height:11%;
    background-image:
      radial-gradient(circle,#4B3527 0 calc(2 * var(--ui-unit)),transparent calc(2.5 * var(--ui-unit))),
      radial-gradient(circle,#71503A 0 calc(1.5 * var(--ui-unit)),transparent calc(2 * var(--ui-unit)));
    background-size:calc(14 * var(--ui-unit)) calc(12 * var(--ui-unit)), calc(17 * var(--ui-unit)) calc(14 * var(--ui-unit));
    transform:rotate(-3deg);
  }
  .dirty-fur{
    inset:0;
    width:100%;
    height:100%;
  }
  .frizzy-fur{
    position:absolute;
    display:block;
    inset:0;
    width:100%;
    height:100%;
    background:url("asset/images/coco-frizzy-fur.png") center bottom / contain no-repeat;
    filter:brightness(0.5) contrast(1.55) drop-shadow(0 calc(0.5 * var(--ui-unit)) calc(0.5 * var(--ui-unit)) rgba(0,0,0,0.22));
  }
  .dirt-stains{
    position:absolute;
    inset:0;
    display:block;
    pointer-events:none;
  }
  .dirt-stain{
    position:absolute;
    display:block;
    width:var(--stain-w,11%);
    height:var(--stain-h,5%);
    border-radius:52% 38% 58% 42% / 44% 61% 39% 56%;
    background:
      radial-gradient(ellipse at 36% 46%,rgba(119,84,57,0.68) 0 26%,rgba(119,84,57,0.34) 48%,transparent 73%),
      radial-gradient(ellipse at 71% 58%,rgba(151,116,78,0.54) 0 18%,transparent 61%);
    filter:blur(calc(0.25 * var(--ui-unit)));
    mix-blend-mode:multiply;
    opacity:0.78;
    transform:rotate(var(--stain-r,0deg));
  }
  .dirt-stain::before,
  .dirt-stain::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(116,80,53,0.56);
  }
  .dirt-stain::before{
    left:-8%;
    top:48%;
    width:18%;
    aspect-ratio:1;
    box-shadow:calc(8 * var(--ui-unit)) calc(-2 * var(--ui-unit)) 0 calc(-1 * var(--ui-unit)) rgba(138,98,65,0.48);
  }
  .dirt-stain::after{
    right:-4%;
    bottom:5%;
    width:12%;
    aspect-ratio:1;
  }
  .stain-ear{
    left:24%;
    top:14%;
    --stain-w:10%;
    --stain-h:4.8%;
    --stain-r:-18deg;
  }
  .stain-forehead{
    left:43%;
    top:27%;
    --stain-w:13%;
    --stain-h:5.5%;
    --stain-r:8deg;
  }
  .stain-temple{
    left:12%;
    top:37%;
    --stain-w:11%;
    --stain-h:5%;
    --stain-r:20deg;
  }
  .stain-cheek{
    left:75%;
    top:40%;
    --stain-w:10%;
    --stain-h:4.6%;
    --stain-r:-13deg;
  }
  .stain-tail{
    left:85%;
    top:79%;
    --stain-w:7%;
    --stain-h:3.5%;
    --stain-r:-12deg;
    opacity:0.48;
  }
  .stain-tail::before,
  .stain-tail::after{ display:none; }
  .dirty-fly{
    left:50%;
    top:25%;
    width:calc(5 * var(--ui-unit));
    height:calc(5 * var(--ui-unit));
  }
  .gnat{
    position:absolute;
    left:0;
    top:0;
    width:calc(5 * var(--ui-unit));
    height:calc(7 * var(--ui-unit));
    border-radius:55% 55% 45% 45%;
    background:#2E2926;
    box-shadow:0 calc(1 * var(--ui-unit)) 0 #151210;
    animation:gnatFigureEight 4.2s linear infinite;
  }
  .gnat::before,
  .gnat::after{
    content:"";
    position:absolute;
    top:calc(-1 * var(--ui-unit));
    width:calc(5 * var(--ui-unit));
    height:calc(4 * var(--ui-unit));
    border:calc(1 * var(--ui-unit)) solid rgba(67,61,57,0.72);
    border-radius:70% 30% 65% 35%;
    background:rgba(255,255,255,0.5);
    animation:gnatWing 110ms ease-in-out infinite alternate;
  }
  .gnat::before{ right:calc(3 * var(--ui-unit)); transform-origin:right center; transform:rotate(-24deg); }
  .gnat::after{ left:calc(3 * var(--ui-unit)); transform-origin:left center; transform:scaleX(-1) rotate(-24deg); }
  @keyframes gnatFigureEight{
    0%,100%{ transform:translate(0,0) rotate(6deg); }
    12.5%{ transform:translate(calc(24 * var(--ui-unit)),calc(-13 * var(--ui-unit))) rotate(18deg); }
    25%{ transform:translate(calc(43 * var(--ui-unit)),0) rotate(8deg); }
    37.5%{ transform:translate(calc(24 * var(--ui-unit)),calc(13 * var(--ui-unit))) rotate(-12deg); }
    50%{ transform:translate(0,0) rotate(-5deg); }
    62.5%{ transform:translate(calc(-24 * var(--ui-unit)),calc(-13 * var(--ui-unit))) rotate(-18deg); }
    75%{ transform:translate(calc(-43 * var(--ui-unit)),0) rotate(-8deg); }
    87.5%{ transform:translate(calc(-24 * var(--ui-unit)),calc(13 * var(--ui-unit))) rotate(12deg); }
  }
  @keyframes gnatWing{
    from{ opacity:0.35; }
    to{ opacity:0.85; }
  }
  @media (prefers-reduced-motion:reduce){
    .gnat{ animation-duration:10s; }
    .gnat::before,
    .gnat::after{ animation-duration:280ms; }
  }
  .dirty-paws{
    left:20%;
    bottom:1%;
    width:calc(82 * var(--ui-unit));
    height:calc(39 * var(--ui-unit));
    border-radius:50%;
    background:
      radial-gradient(circle at 22% 47%,#876B51 0 calc(5 * var(--ui-unit)),transparent calc(6 * var(--ui-unit))),
      radial-gradient(circle at 40% 25%,#876B51 0 calc(5 * var(--ui-unit)),transparent calc(6 * var(--ui-unit))),
      radial-gradient(circle at 59% 25%,#876B51 0 calc(5 * var(--ui-unit)),transparent calc(6 * var(--ui-unit))),
      radial-gradient(circle at 76% 47%,#876B51 0 calc(5 * var(--ui-unit)),transparent calc(6 * var(--ui-unit))),
      radial-gradient(ellipse at 50% 76%,#95775A 0 calc(17 * var(--ui-unit)),transparent calc(18 * var(--ui-unit)));
    filter:drop-shadow(0 calc(2 * var(--ui-unit)) calc(2 * var(--ui-unit)) rgba(0,0,0,0.14));
  }
  .hub-message{
    position:absolute;
    z-index:8;
    left:6%;
    bottom:5%;
    width:58%;
    margin:0;
    padding:calc(10 * var(--ui-unit)) calc(12 * var(--ui-unit));
    border-radius:calc(14 * var(--ui-unit));
    background:rgba(255,253,246,0.94);
    border:calc(1 * var(--ui-unit)) solid rgba(195,31,38,0.15);
    color:#4A443B;
    text-align:center;
    font-size:calc(12 * var(--ui-unit));
    line-height:1.4;
    box-shadow:0 calc(4 * var(--ui-unit)) calc(12 * var(--ui-unit)) rgba(0,0,0,0.07);
  }
  .care-menu{
    position:absolute;
    z-index:10;
    top:calc(70 * var(--ui-unit));
    right:calc(10 * var(--ui-unit));
    bottom:calc(18 * var(--ui-unit));
    width:31%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:calc(7 * var(--ui-unit));
  }
  .care-button{
    position:relative;
    width:100%;
    min-height:calc(70 * var(--ui-unit));
    border:0;
    border-radius:calc(18 * var(--ui-unit));
    background:rgba(255,253,246,0.94);
    color:#4A443B;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:calc(2 * var(--ui-unit));
    cursor:pointer;
    box-shadow:0 calc(4 * var(--ui-unit)) calc(12 * var(--ui-unit)) rgba(67,45,30,0.1);
    transition:transform 150ms ease, box-shadow 150ms ease, background 200ms ease;
  }
  .care-button:active{ transform:scale(0.96); }
  .care-button.playable{
    border:calc(2 * var(--ui-unit)) solid rgba(195,31,38,0.7);
    animation:carePulse 1.8s ease-in-out infinite;
  }
  @keyframes carePulse{
    0%,100%{ box-shadow:0 calc(4 * var(--ui-unit)) calc(12 * var(--ui-unit)) rgba(67,45,30,0.1); }
    50%{ box-shadow:0 calc(5 * var(--ui-unit)) calc(18 * var(--ui-unit)) rgba(195,31,38,0.26); }
  }
  .care-button.done{
    background:#FDEDEE;
    border:calc(2 * var(--ui-unit)) solid var(--brand-red);
    animation:none;
  }
  .care-icon{ font-size:calc(23 * var(--ui-unit)); line-height:1; }
  .care-label{ font-size:calc(10 * var(--ui-unit)); font-weight:700; }
  .care-status{
    position:absolute;
    top:calc(5 * var(--ui-unit));
    right:calc(6 * var(--ui-unit));
    font-size:calc(10 * var(--ui-unit));
    color:#8A8378;
  }
  .care-button.done .care-status{
    width:calc(17 * var(--ui-unit));
    height:calc(17 * var(--ui-unit));
    border-radius:50%;
    background:var(--brand-red);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hub-toast{
    position:absolute;
    z-index:20;
    left:50%;
    bottom:calc(16 * var(--ui-unit));
    max-width:80%;
    transform:translate(-50%,calc(12 * var(--ui-unit)));
    padding:calc(9 * var(--ui-unit)) calc(14 * var(--ui-unit));
    border-radius:calc(999 * var(--ui-unit));
    background:#2B2620;
    color:#fff;
    font-size:calc(11 * var(--ui-unit));
    opacity:0;
    pointer-events:none;
    transition:opacity 180ms ease, transform 180ms ease;
  }
  .hub-toast.show{ opacity:1; transform:translate(-50%,0); }
  .hub-complete-glow{
    position:absolute;
    z-index:2;
    inset:0;
    opacity:0;
    pointer-events:none;
    background:radial-gradient(circle at 38% 46%,rgba(255,237,125,0.55),transparent 48%);
    transition:opacity 400ms ease;
  }
  .hub-screen.all-complete .hub-complete-glow{ opacity:1; }

  /* ---------- game stage ---------- */
  .game-stage{
    position:relative;

    pointer-events:none;
  }
  .ui-panel.fur-panel,
  .ui-panel.dental-panel{
    bottom:calc(2% + calc(61 * var(--ui-unit)));
    min-height:0;
    height:0;
    padding:0;
    border:0;
    background:transparent;
    box-shadow:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .ui-panel.fur-panel .stage-indicator,
  .ui-panel.dental-panel .stage-indicator{ display:none; }
  .ui-panel.eye-panel{
    bottom:2%;
    min-height:0;
    height:0;
    padding:0;
    border:0;
    background:transparent;
    box-shadow:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .ui-panel.eye-panel .stage-indicator{ display:none; }
  .game-stage.paw-mode .paw-prep{ bottom:14%; }
  .game-stage.eye-mode .eye-comb-pickup{ bottom:14%; }

  /* 실제 플레이 중에는 하단 순서표를 미니 상태바로 접어 아래쪽 타깃을 가리지 않는다. */
  .game-stage.compact-play-ui .ui-panel:not(.fur-panel):not(.dental-panel):not(.eye-panel){
    left:6%;
    right:6%;
    bottom:0;
    min-height:calc(34 * var(--ui-unit));
    padding:calc(2 * var(--ui-unit)) calc(7 * var(--ui-unit)) calc(1 * var(--ui-unit));
    border-radius:calc(14 * var(--ui-unit));
    background:rgba(255,253,246,.88);
  }
  .game-stage.compact-play-ui .dot{ gap:0; }
  .game-stage.compact-play-ui .dot-icon{ width:calc(18 * var(--ui-unit)); height:calc(18 * var(--ui-unit)); border-width:calc(1.5 * var(--ui-unit)); }
  .game-stage.compact-play-ui .dot-icon img{ width:calc(11 * var(--ui-unit)); height:calc(11 * var(--ui-unit)); }
  .game-stage.compact-play-ui .dot:not(.active) .dot-label{ display:none; }
  .game-stage.compact-play-ui .dot.active .dot-label{ font-size:calc(7 * var(--ui-unit)); font-weight:800; color:var(--brand-red); }

  .game-stage.compact-play-ui .fur-tool-tray,
  .game-stage.compact-play-ui .dental-tool-tray{
    bottom:0;
    height:calc(34 * var(--ui-unit));
    padding:calc(2 * var(--ui-unit)) calc(5 * var(--ui-unit));
    border-radius:calc(14 * var(--ui-unit));
    background:rgba(255,253,246,.88);
  }
  .game-stage.compact-play-ui .fur-tray-step,
  .game-stage.compact-play-ui .dental-tray-step{ gap:0; transform:none; }
  .game-stage.compact-play-ui .fur-tray-step img{ width:calc(18 * var(--ui-unit)); height:calc(18 * var(--ui-unit)); }
  .game-stage.compact-play-ui .dental-tray-step img{ width:calc(20 * var(--ui-unit)); height:calc(21 * var(--ui-unit)); }
  .game-stage.compact-play-ui .fur-tray-step:not(.active) span,
  .game-stage.compact-play-ui .dental-tray-step:not(.active) span{ display:none; }
  .game-stage.compact-play-ui .fur-tray-step.active span,
  .game-stage.compact-play-ui .dental-tray-step.active span{
    font-size:calc(6 * var(--ui-unit));
    color:var(--brand-red);
  }
  .game-stage.compact-play-ui .ui-panel.fur-panel,
  .game-stage.compact-play-ui .ui-panel.dental-panel{
    bottom:calc(39 * var(--ui-unit));
  }


  /* Scale the 480px artwork and its header together to fit either axis.
     All fixed design lengths above inherit this unit, including animation offsets. */
  .app{
    --ui-unit:calc(min(480px, calc(100vw - var(--pad-h)), calc((100vh - var(--pad-v)) * 480 / 652)) / 480);
    --ui-unit:calc(min(480px, calc(100vw - var(--pad-h)), calc((100dvh - var(--pad-v)) * 480 / 652)) / 480);
    width:calc(480 * var(--ui-unit));
    max-width:none;
    gap:calc(18 * var(--ui-unit));
    flex-shrink:0;
  }
  .hub-screen,.game-stage{
    width:100%;
    max-width:none;
    flex-shrink:0;
  }
  .hub-screen{ aspect-ratio:4 / 5; }
  .game-stage{ aspect-ratio:1122 / 1402; }
  .care-label,.instruction-text,.hub-message,
  .paw-prep,.prep-combined-button,.fur-tap-tool span,.dental-prep span{
    overflow-wrap:break-word;
  }
  .care-button{ min-width:0; }
  .paw-prep{ max-width:88%; }
</style>

<body>
<audio id="bgmPlayer" loop preload="none"></audio>

<div class="app">
  <header class="brand-header">

  <section class="hub-screen" id="hubScreen" aria-label="Choose a care game for Coco">

      </button>

  <main class="game-stage game-only" id="gameStage" hidden>

        <i class="fur-game-stain"></i><i class="fur-game-stain"></i>

        <i class="tangle-strand" style="--fur-img:url('asset/images/fur-tangle-coco-v2.png');--x:66%;--y:17%;--w:28%;--h:17%;--r:10deg"></i>
        <i class="tangle-strand" style="--fur-img:url('asset/images/fur-tangle-coco-v2.png');--x:8%;--y:34%;--w:25%;--h:20%;--r:-20deg"></i>
        <i class="tangle-strand" style="--fur-img:url('asset/images/fur-tangle-coco-v2.png');--x:37%;--y:35%;--w:29%;--h:18%;--r:-5deg"></i>
        <i class="tangle-strand" style="--fur-img:url('asset/images/fur-tangle-coco-v2.png');--x:67%;--y:39%;--w:27%;--h:18%;--r:13deg"></i>
        <i class="tangle-strand" style="--fur-img:url('asset/images/fur-tangle-coco-v2.png');--x:7%;--y:56%;--w:25%;--h:20%;--r:20deg"></i>
        <i class="tangle-strand" style="--fur-img:url('asset/images/fur-tangle-coco-v2.png');--x:36%;--y:56%;--w:29%;--h:18%;--r:3deg"></i>
        <i class="tangle-strand" style="--fur-img:url('asset/images/fur-tangle-coco-v2.png');--x:66%;--y:61%;--w:27%;--h:18%;--r:-10deg"></i>

        <div class="fur-tray-step" data-fur-step="towel"><img src="asset/images/fur-towel.png" alt=""><span>Towel</span></div>
        <div class="fur-tray-step" data-fur-step="mist"><img src="asset/images/fur-mist-tray.png" alt=""><span>Mist</span></div>
        <div class="fur-tray-step" data-fur-step="brush"><img src="asset/images/fur-brush.png" alt=""><span>Brush</span></div>

    <!-- 눈곱 케어: 한쪽 눈씩 7개를 빗으로 드래그 제거 -->

    <p class="instruction-text" id="instructionText">Put on the pad</p>
    <footer class="ui-panel game-only" id="gamePanel" hidden>
    <div class="stage-indicator" id="stageIndicator">
      <div class="dot" data-stage="prep1">
        <span class="dot-icon"><img src="asset/images/hand.png" alt=""></span>
        <span class="dot-label">Pad</span>
      </div>
      <div class="dot" data-stage="prep2">
        <span class="dot-icon"><img src="asset/images/cleanser.png" alt=""></span>
        <span class="dot-label">Spray</span>
      </div>
      <div class="dot" data-stage="stage1">
        <span class="dot-icon"><img src="asset/images/pad.png" alt=""></span>
        <span class="dot-label">Wipe</span>
      </div>
      <div class="dot" data-stage="stage2">
        <span class="dot-icon"><img src="asset/images/brush.png" alt=""></span>
        <span class="dot-label">Brush</span>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </footer>
  </main>
</div>

<script>
(function(){
  "use strict";

  var CHIN_TOOL_ICONS = { stage1: "asset/images/pad.png", stage2: "asset/images/brush.png" };
  var CHIN_INSTRUCTIONS = {
    prep1: "",
    prep2: "",
    stage1: "Gently wipe with the pad",
    stage2: "Brush away the buildup",
    complete: ""
  };
  var DENTAL_DRAG_DISTANCE = { upper: 1250, lower: 1250, edge: 520 };
  var DENTAL_COVERAGE_TARGET = { upper: 0.90, lower: 0.90, edge: 0.82 };

    // 시작 등)에서 수시로 호출되므로, 여기서 syncBgm을 부르면 openCareCategory/returnToHub가

    // BGM 시작/볼륨 전환은 아래 pointerdown 첫 제스처 리스너와 openCareCategory/returnToHub에서만 담당.
  }
  function playCompleteChime(){
    if(!soundEnabled || !audioCtx) return;
    var now = audioCtx.currentTime;
    var freqs = [880.00, 1174.66, 1567.98, 2093.00]; // 상승 아르페지오 (A5-D6-G6-C7)
    freqs.forEach(function(freq, i){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      var start = now + i * 0.09;
      var end = start + 0.28;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(end + 0.02);
    });
  }
  function playFinalTransformationChime(){
    if(!soundEnabled || !audioCtx) return;
    var now = audioCtx.currentTime;
    var freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    freqs.forEach(function(freq, i){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = (i % 2 === 0) ? "sine" : "triangle";
      osc.frequency.value = freq;
      var start = now + i * 0.075;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(0.13, start + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.42);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.44);
    });
  }

    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);

    for(var i = 0; i < len; i++){ data[i] = Math.random() * 2 - 1; }
    return noiseBuffer;

    src.start(now, offset, opts.duration);
    src.stop(now + opts.duration + 0.02);

  // 효과음을 전부 이 실효값(RMS)에 맞춰 자동으로 게인을 계산해서 재생한다.
  // 합성음 sfx.*의 gainPeak가 대략 0.055~0.14 사이인 것과 감이 맞도록 잡은 기준치라,
  // 실제 파일을 들어보면서 이 값 하나만 조정하면 전체 효과음 크기가 같이 움직인다.
  var SFX_TARGET_RMS = 0.09;

  // 무료 SFX 파일은 앞에 무음이 섞여 들어오는 경우가 많아서(다운로드 사이트마다 페이드인 여백이 다름),
  // 파일 길이와 무관하게 실제 소리가 시작되는 지점을 자동으로 찾아 그 지점부터 재생한다.
  // 임계값은 그 파일 자체 피크의 6%(또는 절대치 0.015 중 큰 쪽) — 파일마다 상대적으로 판단해서
  // 조용한 녹음이든 크게 노멀라이즈된 녹음이든 똑같이 잘 잡히게 함.
  function findSoundOnsetSec(data, sampleRate, peak){
    var threshold = Math.max(peak * 0.06, 0.015);
    for(var i = 0; i < data.length; i++){
      var av = data[i] < 0 ? -data[i] : data[i];
      if(av >= threshold){
        // 트랜지언트 바로 앞에서 뚝 끊기는 클릭음이 나지 않도록 2ms 정도 여유를 남겨둠
        return Math.max(0, i / sampleRate - 0.002);
      }
    }
    return 0;
  }

  function computeBufferMeta(buffer){
    var data = buffer.getChannelData(0);
    var sampleRate = buffer.sampleRate;

    // 1차: 전체 피크를 먼저 구해서 무음 판정 임계값을 잡고, 실제 소리가 시작되는 지점을 찾는다
    var roughPeak = 0;
    for(var i = 0; i < data.length; i++){
      var av0 = data[i] < 0 ? -data[i] : data[i];
      if(av0 > roughPeak) roughPeak = av0;
    }
    var leadInSec = findSoundOnsetSec(data, sampleRate, roughPeak);
    var onsetSample = Math.round(leadInSec * sampleRate);

    // 2차: 앞쪽 무음을 뺀 실제로 들리는 구간만으로 rms/peak를 다시 계산.
    // 무음 구간까지 평균에 끼면 rms가 실제보다 낮게 나와서 게인이 과도하게 커지는 문제가 생김.
    var sumSq = 0, peak = 0;
    for(var j = onsetSample; j < data.length; j++){
      var v = data[j];
      sumSq += v * v;
      var av = v < 0 ? -v : v;
      if(av > peak) peak = av;
    }
    var span = data.length - onsetSample;
    var rms = span > 0 ? Math.sqrt(sumSq / span) : 0;
    return { rms: rms, peak: peak, leadInSec: leadInSec };
  }

  function prepareAudioBuffer(url){
    if(!url) return Promise.resolve(null);
    if(audioBufferCache[url]) return Promise.resolve(audioBufferCache[url]);
    if(audioBufferPromises[url]) return audioBufferPromises[url];
    audioBufferPromises[url] = fetch(url)
      .then(function(res){ return res.arrayBuffer(); })
      .then(function(bytes){
        ensureAudioContext();
        if(!audioCtx) throw new Error("no audio context");
        return audioCtx.decodeAudioData(bytes.slice(0));
      })
      .then(function(buffer){
        audioBufferCache[url] = buffer;
        audioBufferMeta[url] = computeBufferMeta(buffer);
        return buffer;
      })
      .catch(function(err){
        delete audioBufferPromises[url];
        console.warn("[audio] Could not load audio:", url, err);
        return null;
      });
    return audioBufferPromises[url];
  }

  // SFX_TARGET_RMS 기준으로 이 파일에 걸어야 할 게인을 계산.
  // 피크 기준 상한(0.98/peak)을 같이 걸어서, 조용한 원본이라도 증폭 때문에 클리핑되지 않게 함.
  function computeNormalizedGain(url){
    var meta = audioBufferMeta[url];
    if(!meta || meta.rms <= 0) return 1;
    var gain = SFX_TARGET_RMS / meta.rms;
    if(meta.peak > 0){ gain = Math.min(gain, 0.98 / meta.peak); }
    return Math.max(0.05, Math.min(gain, 6)); // 과도한 증폭/감쇠 방지
  }

  // 등록된 실제 음원 파일을 전부 미리 fetch+decode. 첫 제스처가 아니라 게임 화면
  // 진입 시점(openCareCategory)에 불러서, 실제로 소리가 필요한 순간엔 지연이 0이 되게 한다.
  function prepareAllSfxBuffers(){
    Object.keys(SFX_FILES).forEach(function(key){
      prepareAudioBuffer(SFX_FILES[key]);
    });
  }

  // url에 해당하는 버퍼가 이미 디코드되어 있으면 재생하고 true를 돌려준다.
  // 아직 준비 안 됐거나 url이 비어있으면 false를 돌려줘서, 호출부가 합성음으로 폴백하게 한다.
  function playAudioBuffer(url, opts){
    if(!soundEnabled || !audioCtx || !url) return false;
    var buffer = audioBufferCache[url];
    if(!buffer) return false;
    opts = opts || {};
    var source = audioCtx.createBufferSource();
    source.buffer = buffer;
    var gainNode = audioCtx.createGain();
    // gain을 명시하지 않으면 SFX_TARGET_RMS 기준 자동 정규화 게인을 사용 → 파일마다 원본 음량이
    // 달라도 재생되는 크기는 비슷하게 맞춰짐(절대적인 dB 지정 대신 RMS 정규화 방식).
    gainNode.gain.value = (opts.gain != null) ? opts.gain : computeNormalizedGain(url);
    source.playbackRate.value = (opts.rate != null) ? opts.rate : 1;
    source.loop = !!opts.loop;
    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    // 파일 앞에 무음이 섞여 있어도 실제 소리가 시작되는 지점(leadInSec)부터 바로 재생.
    var meta = audioBufferMeta[url];
    var offset = (opts.offset != null) ? opts.offset : (meta ? meta.leadInSec : 0);
    if(source.loop){ source.loopStart = offset; } // 루프도 매번 무음부터 다시 재생되지 않도록
    source.start(0, offset);
    if(opts.onEnded) source.onended = opts.onEnded;
    return { source: source, gain: gainNode };
  }

  // 드래그 속도를 0~1로 정규화한 뒤 재생속도 구간(base~base+spread)으로 매핑.
  // 새 스트로크 시작이면 snap=true로 즉시 반영, 스트로크 도중이면 snap=false로 완만히 보간.
  // (루프 사운드를 쓰는 드래그형 미니게임에 실제 음원을 넣을 때 활용)
  function mapSpeedToPlaybackRate(speed, floor, range, base, spread){
    var normalized = Math.max(0, Math.min(1, (speed - floor) / range));
    return base + normalized * spread;
  }
  function applyPlaybackRate(sourceNode, targetRate, snap, smoothing){
    if(!sourceNode || !sourceNode.playbackRate) return;
    if(snap){
      sourceNode.playbackRate.value = targetRate;
    } else if(audioCtx){
      sourceNode.playbackRate.setTargetAtTime(targetRate, audioCtx.currentTime, smoothing || 0.025);
    }
  }

  // ---------- 배경음악(선택) ----------
  // Web Audio 그래프에 연결하지 않는 평범한 <audio loop> 재생이라 createMediaElementSource
  // 문제와 무관함. BGM_FILE에 경로를 채우면 hub 화면에서 자동 재생/페이드된다.
  var BGM_FILE = "asset/audio/bgm05-new-day-again-255071.mp3"; // 90.85초, 256kbps 44.1kHz 스테레오
  var BGM_VOLUME_HUB = 0.35;  // 메인 화면 기본 볼륨
  var BGM_VOLUME_GAME = 0.05; // 미니게임 화면에서는 작게 덕킹(효과음이 잘 들리게)
  var bgmEl = document.getElementById("bgmPlayer");
  var bgmFadeToken = 0;
  function fadeBgmVolume(target, durationMs){
    if(!bgmEl) return;
    var token = ++bgmFadeToken;
    var start = bgmEl.volume;
    var startedAt = performance.now();
    (function step(now){
      if(token !== bgmFadeToken) return;
      var t = Math.max(0, Math.min(1, (now - startedAt) / durationMs));
      bgmEl.volume = start + (target - start) * (1 - Math.pow(1 - t, 3));
      if(t < 1) requestAnimationFrame(step);
    })(performance.now());
  }
  function syncBgm(playing, targetVolume){
    if(!bgmEl || !BGM_FILE) return;
    if(!bgmEl.src){ bgmEl.src = BGM_FILE; }
    if(playing && soundEnabled){
      bgmEl.play().catch(function(){});
      fadeBgmVolume(targetVolume != null ? targetVolume : BGM_VOLUME_HUB, 500);
    } else {
      fadeBgmVolume(0, 400);
    }
  }

  // 개발용 콘솔 도구: 실제 음원의 gain 밸런싱할 때 RMS(실효값)를 참고 숫자로 뽑아본다.
  // 게임 로직에서는 호출하지 않음 — 음원 파일을 넣은 뒤 브라우저 콘솔에서 직접 실행해서 씀.
  // 사용 예: prepareAudioBuffer("asset/stx/rub.mp3").then(()=>__measureRms("asset/stx/rub.mp3"))
  window.__measureRms = function(url, startSec, endSec){
    var buffer = audioBufferCache[url];
    if(!buffer){ console.warn("[audio] Audio not decoded yet:", url); return null; }
    var data = buffer.getChannelData(0);
    var startSample = Math.max(0, Math.floor((startSec || 0) * buffer.sampleRate));
    var endSample = Math.min(data.length, Math.floor((endSec != null ? endSec : buffer.duration) * buffer.sampleRate));
    var sumSq = 0;
    for(var i = startSample; i < endSample; i++){ sumSq += data[i] * data[i]; }
    var rms = Math.sqrt(sumSq / (endSample - startSample));
    console.log("[audio] RMS(" + url + ", " + startSec + "s~" + (endSec != null ? endSec : buffer.duration) + "s) =", rms.toFixed(4));
    return rms;
  };

  // ---------- 완료 스파클(샤랄라) 이펙트 ----------
  function spawnSparkles(){
    sparkleLayer.innerHTML = "";
    var count = 12;
    for(var i = 0; i < count; i++){
      var el = document.createElement("span");
      el.className = "sparkle";
      el.textContent = (i % 2 === 0) ? "✨" : "⭐";
      var angle = Math.random() * Math.PI * 2;
      var dist = 40 + Math.random() * 70;
      var sx = Math.cos(angle) * dist;
      var sy = Math.sin(angle) * dist - 20;
      el.style.left = (50 + (Math.random() * 16 - 8)) + "%";
      el.style.top = (57 + (Math.random() * 10 - 5)) + "%";
      el.style.setProperty("--sx", sx.toFixed(0) + "px");
      el.style.setProperty("--sy", sy.toFixed(0) + "px");
      el.style.animationDelay = (Math.random() * 300).toFixed(0) + "ms";
      el.style.fontSize = (14 + Math.random() * 12).toFixed(0) + "px";
      sparkleLayer.appendChild(el);
    }
  }

  // ---------- 브러시 흡착 파티클 (블랙헤드가 브러시로 날아가 붙는 연출) ----------
  var MAX_PARTICLES_INFLIGHT = 6;
  var MAX_COLLECTED_FLECKS = 10;
  var collectedFlecks = 0;
  var particleAcc = 0;
  var PARTICLE_STEP = 9; // % stage2 진행 누적마다 파티클 1개 발사

  function spawnBlackheadParticle(clientX, clientY, originClientX, originClientY){
    if(particleLayer.childElementCount >= MAX_PARTICLES_INFLIGHT) return;
    var rect = gameStage.getBoundingClientRect();
    var angle = Math.random() * Math.PI * 2;
    var r = rect.width * (0.01 + Math.random() * 0.018);
    var originX = originClientX == null ? rect.width * 0.5 + Math.cos(angle) * r : originClientX - rect.left + Math.cos(angle) * r;
    var originY = originClientY == null ? rect.height * 0.61 + Math.sin(angle) * r : originClientY - rect.top + Math.sin(angle) * r;
    var destX = clientX - rect.left;
    var destY = clientY - rect.top;

    var el = document.createElement("span");
    el.className = "blackhead-particle";
    el.style.left = originX + "px";
    el.style.top = originY + "px";
    el.style.setProperty("--px", (destX - originX) + "px");
    el.style.setProperty("--py", (destY - originY) + "px");
    el.style.setProperty("--dur", (320 + Math.random() * 120).toFixed(0) + "ms");
    particleLayer.appendChild(el);
    el.addEventListener("animationend", function(){
      el.remove();
      addCollectedFleck();
    }, { once: true });
  }

  function addCollectedFleck(){
    if(collectedFlecks >= MAX_COLLECTED_FLECKS) return;
    collectedFlecks++;
    var idx = collectedFlecks - 1;
    var angle = (idx / MAX_COLLECTED_FLECKS) * Math.PI * 2 + 0.4;
    var rr = 26 + (idx % 3) * 6;
    var fleck = document.createElement("span");
    fleck.className = "brush-fleck";
    fleck.style.left = (85 + Math.cos(angle) * rr) + "px";
    fleck.style.top = (58 + Math.sin(angle) * rr * 0.6) + "px";
    toolCursor.appendChild(fleck);
    sfx.pluck();
  }

  function addPadStain(){
    var stain=document.createElement("span");
    stain.className="pad-stain";
    stain.style.left=(58+Math.random()*54)+"px";
    stain.style.top=(55+Math.random()*55)+"px";
    stain.style.setProperty("--stain-rot",(-35+Math.random()*70).toFixed(0)+"deg");
    toolCursor.appendChild(stain);
  }

  // ---------- 털 케어 내부 단계 (상위 상태머신은 그대로 유지) ----------
  var FUR_ACTION_ORDER = ["wet","shampoo","lather","rinse","towel","mist","brush"];
  var FUR_DRAG_DISTANCE = {
    wet:300,
    lather:820,
    rinse:300,
    towel:300,
    brush:850
  };
  var activeFurAction = null;
  var furHeadPath = null;
  var furHeadPathWidth = 0;
  var furHeadPathHeight = 0;
  var furFoamSampleCanvas = document.createElement("canvas");
  furFoamSampleCanvas.width = 48;
  furFoamSampleCanvas.height = 60;
  var furFoamSampleCtx = furFoamSampleCanvas.getContext("2d",{willReadFrequently:true});
  var furFoamStartCells = 0;
  var furRinseDistanceProgress = 0;
  var furRinseLastEraseX = null;
  var furRinseLastEraseY = null;
  var FUR_CARE_GRID_X = 18;
  var FUR_CARE_GRID_Y = 24;
  var FUR_CARE_REQUIRED_PASSES = 1;
  var furCareTargetCells = [];
  var furCareTargetCount = 0;
  var furCarePasses = {wet:new Uint8Array(0),towel:new Uint8Array(0)};
  var furCarePrevious = {wet:new Uint8Array(0),towel:new Uint8Array(0)};
  var furCareDistanceProgress = {wet:0,towel:0};
  var FUR_BRUSH_REQUIRED_PASSES = 1;
  var furBrushPasses = new Uint8Array(tangleStrands.length);
  var furBrushPrevious = new Uint8Array(tangleStrands.length);
  var activeFurBrushTarget = -1;
  var activeFurBrushInside = false;

  function getFurAction(){
    if(selectedCategory !== "fur") return null;
    if(game.state === "prep1") return "wet";
    if(game.state === "prep2") return "shampoo";
    if(game.state === "stage1") return game.fur.phase === "rinse" ? "rinse" : "lather";
    if(game.state === "stage2"){
      if(game.fur.phase === "mist") return "mist";
      if(game.fur.phase === "brush") return "brush";
      if(game.fur.phase === "eject") return "eject";
      return "towel";
    }
    if(game.state === "complete") return "complete";
    return null;
  }

  function getFurInstruction(action){
    var map = {
      wet:"Wet the coat",
      shampoo:"Add shampoo",
      lather:"Lather up",
      rinse:"Rinse off the suds",
      towel:"Towel dry",
      mist:"Spray the mist",
      brush:"Brush out the tangles",
      eject:"Release the collected fur",
      complete:""
    };
    return map[action] || "";
  }

  function syncFurFoamCanvas(){
    var rect = gameStage.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    var scale = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.round(rect.width * scale);
    var h = Math.round(rect.height * scale);
    if(furFoamCanvas.width !== w || furFoamCanvas.height !== h){
      // Preserve painted/erased foam when a device rotates or the viewport changes.
      var previousFoam = document.createElement("canvas");
      previousFoam.width = furFoamCanvas.width;
      previousFoam.height = furFoamCanvas.height;
      previousFoam.getContext("2d").drawImage(furFoamCanvas,0,0);
      furFoamCanvas.width = w;
      furFoamCanvas.height = h;
      furFoamCtx.drawImage(previousFoam,0,0,w,h);
      furFoamCtx.setTransform(scale,0,0,scale,0,0);
    }
    if(!furHeadPath || furHeadPathWidth !== rect.width || furHeadPathHeight !== rect.height){
      furHeadPathWidth = rect.width;
      furHeadPathHeight = rect.height;
      furHeadPath = new Path2D();
      furHeadPath.moveTo(rect.width*.17,rect.height*.51);
      furHeadPath.bezierCurveTo(rect.width*.14,rect.height*.41,rect.width*.19,rect.height*.32,rect.width*.25,rect.height*.27);
      furHeadPath.lineTo(rect.width*.33,rect.height*.09);
      furHeadPath.quadraticCurveTo(rect.width*.38,rect.height*.035,rect.width*.42,rect.height*.12);
      furHeadPath.lineTo(rect.width*.47,rect.height*.28);
      furHeadPath.quadraticCurveTo(rect.width*.50,rect.height*.265,rect.width*.53,rect.height*.28);
      furHeadPath.lineTo(rect.width*.58,rect.height*.12);
      furHeadPath.quadraticCurveTo(rect.width*.62,rect.height*.035,rect.width*.67,rect.height*.09);
      furHeadPath.lineTo(rect.width*.75,rect.height*.27);
      furHeadPath.bezierCurveTo(rect.width*.81,rect.height*.32,rect.width*.86,rect.height*.41,rect.width*.83,rect.height*.51);
      furHeadPath.bezierCurveTo(rect.width*.79,rect.height*.61,rect.width*.64,rect.height*.63,rect.width*.50,rect.height*.62);
      furHeadPath.bezierCurveTo(rect.width*.36,rect.height*.63,rect.width*.21,rect.height*.61,rect.width*.17,rect.height*.51);
      furHeadPath.closePath();
    }
  }

  function clearFurFoam(){
    furFoamCtx.clearRect(0,0,furFoamCanvas.width,furFoamCanvas.height);
    furFoamStartCells = 0;
    furRinseDistanceProgress = 0;
    furRinseLastEraseX = null;
    furRinseLastEraseY = null;
  }

  function furCanvasPoint(clientX,clientY){
    var rect = gameStage.getBoundingClientRect();
    return { x:clientX - rect.left, y:clientY - rect.top };
  }

  function furPointInHead(clientX,clientY){
    var rect=gameStage.getBoundingClientRect();
    if(!rect.width||!rect.height) return false;
    var nx=(clientX-rect.left)/rect.width;
    var ny=(clientY-rect.top)/rect.height;
    // 거품의 중심만 머리 주변에 제한한다. 실제 방울은 윤곽 밖으로 자연스럽게 퍼질 수 있다.
    return ny>=.015&&ny<=.65&&
      Math.pow((nx-.5)/.43,2)+Math.pow((ny-.35)/.34,2)<=1.08;
  }

  function furNormalizedPointOnCoco(nx,ny){
    var head=ny>=.045&&ny<=.62&&Math.pow((nx-.5)/.36,2)+Math.pow((ny-.36)/.30,2)<=1.12;
    var torso=Math.pow((nx-.49)/.30,2)+Math.pow((ny-.68)/.25,2)<=1;
    var legs=ny>=.78&&ny<=.94&&nx>=.24&&nx<=.72;
    var leftArm=Math.pow((nx-.24)/.12,2)+Math.pow((ny-.62)/.18,2)<=1;
    var rightArm=Math.pow((nx-.75)/.12,2)+Math.pow((ny-.62)/.18,2)<=1;
    var tail=Math.pow((nx-.74)/.19,2)+Math.pow((ny-.76)/.15,2)<=1;
    return head||torso||legs||leftArm||rightArm||tail;
  }

  function furPointOnCoco(clientX,clientY){
    var rect=gameStage.getBoundingClientRect();
    if(!rect.width||!rect.height) return false;
    return furNormalizedPointOnCoco((clientX-rect.left)/rect.width,(clientY-rect.top)/rect.height);
  }

  function resetFurCarePasses(){
    var size=FUR_CARE_GRID_X*FUR_CARE_GRID_Y;
    furCareTargetCells=new Uint8Array(size);
    furCareTargetCount=0;
    for(var gy=0;gy<FUR_CARE_GRID_Y;gy++){
      for(var gx=0;gx<FUR_CARE_GRID_X;gx++){
        var nx=(gx+.5)/FUR_CARE_GRID_X;
        var ny=(gy+.5)/FUR_CARE_GRID_Y;
        if(!furNormalizedPointOnCoco(nx,ny)) continue;
        furCareTargetCells[gy*FUR_CARE_GRID_X+gx]=1;
        furCareTargetCount++;
      }
    }
    furCarePasses={wet:new Uint8Array(size),towel:new Uint8Array(size)};
    furCarePrevious={wet:new Uint8Array(size),towel:new Uint8Array(size)};
    furCareDistanceProgress={wet:0,towel:0};
  }

  function clearFurCarePrevious(action){
    if(furCarePrevious[action]) furCarePrevious[action].fill(0);
  }

  function resetFurBrushPasses(){
    furBrushPasses=new Uint8Array(tangleStrands.length);
    furBrushPrevious=new Uint8Array(tangleStrands.length);
    activeFurBrushTarget=-1;
    activeFurBrushInside=false;
  }

  function clearFurBrushPrevious(){
    furBrushPrevious.fill(0);
  }

  function beginFurBrushStroke(){
    clearFurBrushPrevious();
    activeFurBrushTarget=-1;
    activeFurBrushInside=false;
  }

  function endFurBrushStroke(){
    clearFurBrushPrevious();
    activeFurBrushTarget=-1;
    activeFurBrushInside=false;
  }

  function updateFurBrushPasses(clientX,clientY,delta){
    if(delta<=0) return game.fur.brush;
    // 가장 가까운 털뭉치 하나에 고정하되, 누른 상태로 왕복할 때마다 새 빗질로 센다.
    if(activeFurBrushTarget<0){
      var nearestIndex=-1;
      var nearestDistance=Infinity;
      tangleStrands.forEach(function(strand,index){
        if(furBrushPasses[index]>=FUR_BRUSH_REQUIRED_PASSES) return;
        var rect=strand.getBoundingClientRect();
        var padX=Math.max(10,rect.width*.08);
        var padY=Math.max(8,rect.height*.12);
        var touches=clientX>=rect.left-padX&&clientX<=rect.right+padX&&
                    clientY>=rect.top-padY&&clientY<=rect.bottom+padY;
        if(!touches) return;
        var centerX=rect.left+rect.width*.5;
        var centerY=rect.top+rect.height*.5;
        var distance=Math.hypot(clientX-centerX,clientY-centerY);
        if(distance<nearestDistance){
          nearestDistance=distance;
          nearestIndex=index;
        }
      });
      activeFurBrushTarget=nearestIndex;
    }
    if(activeFurBrushTarget>=0){
      var activeRect=tangleStrands[activeFurBrushTarget].getBoundingClientRect();
      var activePadX=Math.max(10,activeRect.width*.08);
      var activePadY=Math.max(8,activeRect.height*.12);
      var isInside=clientX>=activeRect.left-activePadX&&clientX<=activeRect.right+activePadX&&
                   clientY>=activeRect.top-activePadY&&clientY<=activeRect.bottom+activePadY;
      if(isInside&&!activeFurBrushInside){
        furBrushPasses[activeFurBrushTarget]++;
        activeFurBrushInside=true;
        sfx.pluck();
        if(furBrushPasses[activeFurBrushTarget]>=FUR_BRUSH_REQUIRED_PASSES){
          activeFurBrushTarget=-1;
          activeFurBrushInside=false;
        }
      }else if(!isInside){
        activeFurBrushInside=false;
      }
    }
    var passTotal=0;
    for(var i=0;i<furBrushPasses.length;i++) passTotal+=furBrushPasses[i];
    return Math.min(100,passTotal/(Math.max(1,tangleStrands.length)*FUR_BRUSH_REQUIRED_PASSES)*100);
  }

  function updateFurCarePasses(action,clientX,clientY,delta){
    if(action!=="wet"&&action!=="towel") return 0;
    if(!furCareTargetCount) resetFurCarePasses();
    var rect=gameStage.getBoundingClientRect();
    if(!rect.width||!rect.height) return 0;
    var current=new Uint8Array(FUR_CARE_GRID_X*FUR_CARE_GRID_Y);
    for(var gy=0;gy<FUR_CARE_GRID_Y;gy++){
      for(var gx=0;gx<FUR_CARE_GRID_X;gx++){
        var index=gy*FUR_CARE_GRID_X+gx;
        if(!furCareTargetCells[index]) continue;
        var cx=rect.left+(gx+.5)/FUR_CARE_GRID_X*rect.width;
        var cy=rect.top+(gy+.5)/FUR_CARE_GRID_Y*rect.height;
        var touches=action==="wet"
          ? (cx>=clientX-designPx(58)&&cx<=clientX+designPx(124)&&cy>=clientY+designPx(8)&&cy<=clientY+designPx(208))
          : (Math.pow((cx-clientX)/designPx(118),2)+Math.pow((cy-clientY)/designPx(94),2)<=1);
        if(!touches) continue;
        current[index]=1;
        if(!furCarePrevious[action][index]&&furCarePasses[action][index]<FUR_CARE_REQUIRED_PASSES){
          furCarePasses[action][index]++;
        }
      }
    }
    furCarePrevious[action]=current;
    furCareDistanceProgress[action]=Math.min(100,furCareDistanceProgress[action]+delta);
    var passTotal=0;
    for(var i=0;i<furCarePasses[action].length;i++) passTotal+=furCarePasses[action][i];
    var coverageTarget=Math.max(1,furCareTargetCount*FUR_CARE_REQUIRED_PASSES*.72);
    var coverageProgress=Math.min(100,passTotal/coverageTarget*100);
    return Math.min(furCareDistanceProgress[action],coverageProgress);
  }

  function furWaterTouchesCoco(clientX,clientY){
    // 포인터는 샤워기 본체 중심이다. 아래쪽 물줄기 직사각형만 접촉 판정에 사용한다.
    var xOffsets=[-12,16,44,72];
    var yOffsets=[30,70,110,150];
    for(var yi=0;yi<yOffsets.length;yi++){
      for(var xi=0;xi<xOffsets.length;xi++){
        if(furPointOnCoco(clientX+designPx(xOffsets[xi]),clientY+designPx(yOffsets[yi]))) return true;
      }
    }
    return false;
  }

  function furWaterFoamContactPoint(clientX,clientY){
    var xOffsets=[-12,16,44,72];
    var yOffsets=[30,70,110,150];
    var sumX=0,sumY=0,count=0;
    for(var yi=0;yi<yOffsets.length;yi++){
      for(var xi=0;xi<xOffsets.length;xi++){
        var sampleX=clientX+designPx(xOffsets[xi]),sampleY=clientY+designPx(yOffsets[yi]);
        if(!furPointInHead(sampleX,sampleY)) continue;
        sumX+=sampleX;
        sumY+=sampleY;
        count++;
      }
    }
    return count ? {x:sumX/count,y:sumY/count} : null;
  }

  function furWaterTouchesFoamArea(clientX,clientY){
    return !!furWaterFoamContactPoint(clientX,clientY);
  }

  function furTowelTouchesCoco(clientX,clientY){
    var offsets=[[0,0],[-54,0],[54,0],[0,-48],[0,48],[-38,-34],[38,-34],[-38,34],[38,34]];
    for(var i=0;i<offsets.length;i++){
      if(furPointOnCoco(clientX+designPx(offsets[i][0]),clientY+designPx(offsets[i][1]))) return true;
    }
    return false;
  }

  function countFurFoamCells(){
    furFoamSampleCtx.clearRect(0,0,furFoamSampleCanvas.width,furFoamSampleCanvas.height);
    furFoamSampleCtx.drawImage(furFoamCanvas,0,0,furFoamSampleCanvas.width,furFoamSampleCanvas.height);
    var pixels=furFoamSampleCtx.getImageData(0,0,furFoamSampleCanvas.width,furFoamSampleCanvas.height).data;
    var count=0;
    for(var i=3;i<pixels.length;i+=4){
      if(pixels[i]>8) count++;
    }
    return count;
  }

  function drawFoamAt(clientX,clientY){
    syncFurFoamCanvas();
    if(!furPointInHead(clientX,clientY)) return false;
    var p = furCanvasPoint(clientX,clientY);
    furFoamCtx.save();
    furFoamCtx.globalCompositeOperation = "source-over";
    for(var i=0;i<7;i++){
      var angle = Math.random() * Math.PI * 2;
      var dist = designPx(Math.random() * 32);
      var radius = designPx(9 + Math.random() * 13);
      furFoamCtx.beginPath();
      furFoamCtx.arc(p.x + Math.cos(angle)*dist,p.y + Math.sin(angle)*dist,radius,0,Math.PI*2);
      furFoamCtx.fillStyle = "rgba(255,255,255," + (0.66 + Math.random()*0.25).toFixed(2) + ")";
      furFoamCtx.fill();
      furFoamCtx.lineWidth = designPx(1.5);
      furFoamCtx.strokeStyle = "rgba(150,218,239,0.68)";
      furFoamCtx.stroke();
    }
    furFoamCtx.restore();
    return true;
  }

  function eraseFoamAt(clientX,clientY){
    syncFurFoamCanvas();
    if(!furPointInHead(clientX,clientY)) return false;
    if(furRinseLastEraseX != null && Math.hypot(clientX-furRinseLastEraseX,clientY-furRinseLastEraseY)<designPx(34)){
      return true;
    }
    furRinseLastEraseX=clientX;
    furRinseLastEraseY=clientY;
    var p = furCanvasPoint(clientX,clientY);
    var g = furFoamCtx.createRadialGradient(p.x,p.y,designPx(8),p.x,p.y,designPx(84));
    g.addColorStop(0,"rgba(0,0,0,1)");
    g.addColorStop(0.7,"rgba(0,0,0,0.9)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    furFoamCtx.save();
    furFoamCtx.globalCompositeOperation = "destination-out";
    // 자사몰 루틴 체험에서는 한두 번의 넓은 헹굼으로 거품이 제거되도록 한다.
    furFoamCtx.globalAlpha = .96;
    furFoamCtx.fillStyle = g;
    furFoamCtx.beginPath();
    furFoamCtx.arc(p.x,p.y,designPx(86),0,Math.PI*2);
    furFoamCtx.fill();
    furFoamCtx.restore();
    return true;
  }

  function setFurPhase(phase){
    if(phase === "rinse"){
      furFoamStartCells = Math.max(1,countFurFoamCells());
      furRinseDistanceProgress = 0;
      furRinseLastEraseX = null;
      furRinseLastEraseY = null;
      game.fur.rinse = 0;
    }
    if(phase === "brush"){
      resetFurBrushPasses();
      game.fur.brush = 0;
    }
    game.fur.phase = phase;
    game.isDragging = false;
    activeFurAction = null;
    activeDentalAction = null;
    activePawAction = null;
    activePawTarget = null;
    activeChinTarget = null;
    pawLastMassageAngle = null;
    activePointerId = null;
    toolCursor.classList.remove("visible");
    toolCursor.classList.remove("edge-tool");
    toolCursor.classList.remove("chin-pad-tool","chin-brush-tool");
    furWaterStream.classList.remove("show");
    furHitbox.classList.remove("dragging");
    render();
  }

  function updateFurDerivedProgress(){
    game.progress.stage1 = (game.fur.lather + game.fur.rinse) / 2;
    game.progress.stage2 = (game.fur.towel + (game.fur.misted ? 100 : 0) + game.fur.brush) / 3;
  }

  function finishFurDragAction(action){
    if(action === "wet"){
      advanceState();
    }else if(action === "lather"){
      setFurPhase("rinse");
    }else if(action === "rinse"){
      clearFurFoam();
      advanceState();
    }else if(action === "towel"){
      setFurPhase("mist");
    }else if(action === "brush"){
      setFurPhase("eject");
    }
  }

  function applyFurDrag(action,delta,clientX,clientY){
    var key = action;
    if(action === "rinse"){
      var waterPoint=furWaterFoamContactPoint(clientX,clientY);
      if(!waterPoint) return;
      if(!eraseFoamAt(waterPoint.x,waterPoint.y)) return;
      furRinseDistanceProgress = Math.min(100,furRinseDistanceProgress + delta);
      var remainingFoam=countFurFoamCells();
      // 가장자리의 작은 거품 몇 개가 남아도 충분히 헹군 것으로 인정한다.
      var allowedRemainder=Math.max(1,Math.floor(furFoamStartCells*.08));
      var removalProgress=remainingFoam<=allowedRemainder
        ? 100
        : Math.min(99,(1-remainingFoam/Math.max(1,furFoamStartCells))*100);
      game.fur.rinse=Math.min(furRinseDistanceProgress,removalProgress);
    }else if(action === "wet" || action === "towel"){
      game.fur[key]=updateFurCarePasses(action,clientX,clientY,delta);
    }else if(action === "brush"){
      game.fur.brush=updateFurBrushPasses(clientX,clientY,delta);
    }else{
      if(action === "lather" && !drawFoamAt(clientX,clientY)) return;
      game.fur[key] = Math.min(100,game.fur[key] + delta);
    }
    updateFurDerivedProgress();

    furSfxAcc += delta;
    if(furSfxAcc >= 11){
      furSfxAcc -= 11;
      if(action === "wet" || action === "rinse"){ sfx.water(); }
      else if(action === "lather"){ sfx.lather(); }
      else if(action === "towel"){ sfx.towel(); }
      else if(action === "brush"){ sfx.brushFur(); }
    }

    if(game.fur[key] >= 100){
      finishFurDragAction(action);
    }
  }

  function handleFurTap(){
    var action = getFurAction();
    if(action !== "shampoo" && action !== "mist" && action !== "eject") return;
    if(furTapTool.classList.contains("acting")) return;
    ensureAudioContext();
    furTapTool.classList.add("acting");

    if(action === "shampoo"){
      furTapToolImg.src = "asset/images/shampoo-pour.png";
      sfx.equip();
      setTimeout(function(){
        furTapTool.classList.remove("acting");
        advanceState();
      },850);
    }else if(action === "mist"){
      furTapToolImg.src = "asset/images/fur-mist-spray.png";
      spawnFurMistBurst();
      game.fur.misted = true;
      updateFurDerivedProgress();
      sfx.spray();
      render();
      setTimeout(function(){
        if(furMistBurst) furMistBurst.innerHTML = "";
        furTapTool.classList.remove("acting");
        setFurPhase("brush");
      },1250);
    }else{
      furScene.classList.add("ejecting");
      sfx.eject();
      setTimeout(function(){
        furTapTool.classList.remove("acting");
        advanceState();
      },650);
    }
  }

  function spawnFurMistBurst(){
    if(!furMistBurst) return;
    furMistBurst.innerHTML = "";
    var fragment = document.createDocumentFragment();

    function addMistPart(className,size,dx,dy,delay,spin){
      var part = document.createElement("i");
      part.className = className;
      part.style.setProperty("--size",size + "px");
      part.style.setProperty("--dx",dx + "px");
      part.style.setProperty("--dy",dy + "px");
      part.style.setProperty("--delay",delay + "ms");
      if(spin != null) part.style.setProperty("--spin",spin + "deg");
      fragment.appendChild(part);
    }

    for(var i=0;i<24;i++){
      var angle = (-160 + Math.random()*140) * Math.PI / 180;
      var distance = 90 + Math.random()*155;
      addMistPart("mist-speck",3 + Math.random()*5,Math.cos(angle)*distance,Math.sin(angle)*distance,Math.random()*120,null);
    }
    for(var h=0;h<6;h++){
      addMistPart("mist-haze",62 + Math.random()*48,(h-2.5)*48 + (Math.random()-.5)*30,-90-Math.random()*120,55+h*45,null);
    }
    for(var p=0;p<4;p++){
      addMistPart("mist-petal",7 + Math.random()*4,(p-1.5)*72 + (Math.random()-.5)*34,-105-Math.random()*120,210+p*75,-95+Math.random()*190);
    }
    furMistBurst.appendChild(fragment);
    setTimeout(function(){
      if(furMistBurst) furMistBurst.innerHTML = "";
    },1450);
  }

  // ---------- 상태머신 ----------
  function getActiveHitboxStage(state){
    if(selectedCategory !== "chin") return null;
    if(state === "stage1" || state === "stage2") return state;
    return null;
  }

  function advanceState(){
    var i = STATE_ORDER.indexOf(game.state);
    if(i < STATE_ORDER.length - 1){
      setState(STATE_ORDER[i + 1]);
    }
  }

  function setState(next){
    var enteringComplete = (next === "complete" && game.state !== "complete");
    game.state = next;
    gameHintEngaged = false;
    if(selectedCategory === "fur"){
      if(next === "prep2"){ game.fur.phase = "shampoo"; }
      else if(next === "stage1"){ game.fur.phase = "lather"; }
      else if(next === "stage2"){ game.fur.phase = "towel"; }
      else if(next === "complete"){ game.fur.phase = "complete"; }
    }
    if(selectedCategory === "eyes"){
      game.eye.side = next === "stage2" || next === "complete" ? "right" : "left";
    }
    game.isDragging = false;
    activeFurAction = null;
    activeDentalAction = null;
    activePawAction = null;
    activePawTarget = null;
    activeChinTarget = null;
    pawLastMassageAngle = null;
    activePointerId = null;
    toolCursor.classList.remove("visible");
    toolCursor.classList.remove("edge-tool");
    toolCursor.classList.remove("chin-pad-tool","chin-brush-tool");
    furWaterStream.classList.remove("show");
    Object.keys(hitboxes).forEach(function(k){ hitboxes[k].classList.remove("dragging"); });
    furHitbox.classList.remove("dragging");
    dentalZone.classList.remove("dragging");
    pawZone.classList.remove("dragging");
    pawBalmCursor.classList.remove("visible");
    pawShikonCursor.classList.remove("visible");
    if(enteringComplete && selectedCategory){
      careCompleted[selectedCategory] = true;
      saveCareProgress();
      pendingFinalCelebration = CARE_CATEGORIES.every(function(category){
        return careCompleted[category];
      });
    }
    render();
    if(enteringComplete){
      spawnSparkles();
      playCompleteChime();
    }
  }

    try{
      localStorage.setItem("jayupet-care-progress-us", JSON.stringify(careCompleted));
    }catch(err){}
  }

  function loadCareProgress(){
    try{
      var saved = JSON.parse(localStorage.getItem("jayupet-care-progress-us") || "null");
      if(!saved) return;
      CARE_CATEGORIES.forEach(function(category){
        careCompleted[category] = saved[category] === true;
      });

    hubToast.textContent = message;

      hubToast.classList.remove("show");

    ensureAudioContext();
    prepareAllSfxBuffers(); // 화면 진입 시점에 미리 fetch+decode → 실제 재생 시점엔 지연 0
